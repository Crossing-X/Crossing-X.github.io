<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>狮小新 · 肚皮向阳</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#060a14;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#fff}
canvas{display:block}
#loader{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#14182e 0%,#060a14 72%);transition:opacity 1s ease}
#loader.hide{opacity:0;pointer-events:none}
.lchar{font-size:80px;color:#f5a623;text-shadow:0 0 50px rgba(245,166,35,.5);animation:lp 2s ease-in-out infinite}
@keyframes lp{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.08);opacity:1}}
#lstatus{margin-top:18px;font-size:13px;letter-spacing:3px;color:rgba(255,255,255,.35)}
#bar{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:10px}
.pbtn{font-family:inherit;font-size:13px;letter-spacing:2px;padding:8px 20px;border-radius:24px;border:1px solid rgba(245,166,35,.3);background:rgba(245,166,35,.08);color:rgba(255,255,255,.7);cursor:pointer;transition:all .3s ease;user-select:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pbtn:hover{background:rgba(245,166,35,.18);color:#fff;border-color:rgba(245,166,35,.5)}
.pbtn.active{background:rgba(245,166,35,.25);color:#ffd080;border-color:rgba(245,166,35,.6);box-shadow:0 0 16px rgba(245,166,35,.15)}
#ui{position:fixed;bottom:0;left:0;right:0;z-index:10;pointer-events:none;padding:0 24px 44px;text-align:center}
#ui h1{font-size:clamp(26px,4.5vw,44px);font-weight:700;letter-spacing:6px;text-shadow:0 0 30px rgba(245,166,35,.35);margin-bottom:12px;opacity:0;transform:translateY(20px);transition:all 1.2s cubic-bezier(.23,1,.32,1) .3s}
#ui .sub{font-size:clamp(12px,1.8vw,15px);letter-spacing:3px;opacity:0;transform:translateY(14px);transition:all 1.2s cubic-bezier(.23,1,.32,1) .6s;color:rgba(255,255,255,.5);margin-bottom:8px;line-height:1.8}
#ui .tag{font-size:clamp(13px,1.8vw,15px);letter-spacing:5px;opacity:0;transform:translateY(14px);transition:all 1.2s cubic-bezier(.23,1,.32,1) .9s;color:rgba(255,255,255,.3)}
#ui.show h1,#ui.show .sub,#ui.show .tag{opacity:1;transform:translateY(0)}
@media(max-width:600px){#bar{top:12px;gap:6px}.pbtn{font-size:11px;padding:6px 14px;letter-spacing:1px}#ui{padding:0 14px 28px}}
</style>
</head>
<body>

<div id="loader">
  <div class="lchar">狮</div>
  <div id="lstatus">正在加载 3D 引擎…</div>
</div>

<div id="bar">
  <button class="pbtn" data-pose="standing">站立</button>
  <button class="pbtn" data-pose="lying">晒肚皮</button>
  <button class="pbtn active" data-pose="laughing">捧腹大笑</button>
</div>

<div id="ui">
  <h1>肚皮交给太阳</h1>
  <p class="sub">嗷呜放放了放了嘛，<br>小新国庆就天天在地上晒肚皮，<br>这假期过得比谁都标准嗷～</p>
  <p class="tag">肚皮朝天 · 诸事不管</p>
</div>

<script>
(function(){
  var srcs=[
    {n:'npmmirror',t:'https://registry.npmmirror.com/three/0.128.0/files/build/three.min.js',c:'https://registry.npmmirror.com/three/0.128.0/files/examples/js/controls/OrbitControls.js'},
    {n:'unpkg',t:'https://unpkg.com/three@0.128.0/build/three.min.js',c:'https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js'},
    {n:'jsdelivr',t:'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',c:'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js'},
    {n:'bootcdn',t:'https://cdn.bootcdn.net/ajax/libs/three.js/r128/three.min.js'}
  ];
  var st=document.getElementById('lstatus'),i=0;
  function ld(url,ms){
    return new Promise(function(ok){
      var s=document.createElement('script'),done=false;
      var tm=setTimeout(function(){if(!done){done=true;s.onload=s.onerror=null;ok(false)}},ms);
      s.onload=function(){if(!done){done=true;clearTimeout(tm);ok(true)}};
      s.onerror=function(){if(!done){done=true;clearTimeout(tm);ok(false)}};
      s.src=url;document.head.appendChild(s);
    });
  }
  function nxt(){
    if(i>=srcs.length){st.textContent='加载失败，请刷新重试';return}
    var s=srcs[i];
    st.textContent='加载引擎中… ('+(i+1)+'/'+srcs.length+')';
    ld(s.t,8000).then(function(ok){
      if(ok&&typeof THREE!=='undefined'){
        if(s.c){ld(s.c,5000).then(function(){st.textContent='搭建场景中…';setTimeout(initScene,80)})}
        else{st.textContent='搭建场景中…';setTimeout(initScene,80)}
      }else{i++;nxt()}
    });
  }
  nxt();
})();
</script>

<script>
/* 内联轨道控制器（CDN 版 OrbitControls 失败时兜底） */
function InlineOrbitControls(cam,el){
  var self=this;
  self.target=new THREE.Vector3(0,1.2,0);
  self.enableDamping=true;self.dampingFactor=0.08;
  self.minDistance=3;self.maxDistance=15;
  self.maxPolarAngle=Math.PI*0.52;self.minPolarAngle=Math.PI*0.08;
  var sph=new THREE.Spherical(),dSph=new THREE.Spherical(),sc=1;
  var off=new THREE.Vector3();
  off.copy(cam.position).sub(self.target);sph.setFromVector3(off);
  var rs=new THREE.Vector2(),rot=false;
  el.addEventListener('mousedown',function(e){if(e.button===0){rot=true;rs.set(e.clientX,e.clientY)}});
  el.addEventListener('mousemove',function(e){if(!rot)return;var dx=e.clientX-rs.x,dy=e.clientY-rs.y;dSph.theta-=2*Math.PI*dx/el.clientWidth;dSph.phi-=2*Math.PI*dy/el.clientHeight;rs.set(e.clientX,e.clientY)});
  el.addEventListener('mouseup',function(){rot=false});
  el.addEventListener('wheel',function(e){e.preventDefault();sc*=e.deltaY<0?0.95:1.05},{passive:false});
  var ts=new THREE.Vector2(),td=0,tst=-1;
  el.addEventListener('touchstart',function(e){if(e.touches.length===1){tst=0;ts.set(e.touches[0].pageX,e.touches[0].pageY)}else if(e.touches.length===2){tst=2;var dx=e.touches[0].pageX-e.touches[1].pageX,dy=e.touches[0].pageY-e.touches[1].pageY;td=Math.sqrt(dx*dx+dy*dy)}},{passive:false});
  el.addEventListener('touchmove',function(e){e.preventDefault();if(tst===0&&e.touches.length===1){var dx=e.touches[0].pageX-ts.x,dy=e.touches[0].pageY-ts.y;dSph.theta-=2*Math.PI*dx/el.clientWidth;dSph.phi-=2*Math.PI*dy/el.clientHeight;ts.set(e.touches[0].pageX,e.touches[0].pageY)}else if(tst===2&&e.touches.length===2){var dx2=e.touches[0].pageX-e.touches[1].pageX,dy2=e.touches[0].pageY-e.touches[1].pageY;var d=Math.sqrt(dx2*dx2+dy2*dy2);sc*=d>td?0.97:1.03;td=d}},{passive:false});
  el.addEventListener('touchend',function(){tst=-1});
  el.addEventListener('contextmenu',function(e){e.preventDefault()});
  self.update=function(){
    off.copy(cam.position).sub(self.target);sph.setFromVector3(off);
    sph.theta+=dSph.theta;sph.phi+=dSph.phi;
    sph.phi=Math.max(self.minPolarAngle,Math.min(self.maxPolarAngle,sph.phi));
    sph.radius*=sc;sph.radius=Math.max(self.minDistance,Math.min(self.maxDistance,sph.radius));
    off.setFromSpherical(sph);cam.position.copy(self.target).add(off);cam.lookAt(self.target);
    var d=self.enableDamping?(1-self.dampingFactor):0;
    dSph.theta*=d;dSph.phi*=d;sc=1;
  };
}

function initScene(){
  var st=document.getElementById('lstatus');
  var W=window.innerWidth,H=window.innerHeight;

  var R=new THREE.WebGLRenderer({antialias:true});
  R.setPixelRatio(Math.min(devicePixelRatio,2));
  R.setSize(W,H);
  R.shadowMap.enabled=true;
  R.shadowMap.type=THREE.PCFSoftShadowMap;
  R.toneMapping=THREE.NoToneMapping;
  document.body.appendChild(R.domElement);

  var scene=new THREE.Scene();
  scene.background=new THREE.Color(0x060a14);
  scene.fog=new THREE.FogExp2(0x060a14,0.018);

  var cam=new THREE.PerspectiveCamera(38,W/H,0.1,120);
  cam.position.set(0,3.0,8.5);

  var ctrl;
  if(typeof THREE.OrbitControls!=='undefined'){ctrl=new THREE.OrbitControls(cam,R.domElement)}
  else{ctrl=new InlineOrbitControls(cam,R.domElement)}
  ctrl.enableDamping=true;ctrl.dampingFactor=0.07;
  ctrl.minDistance=3;ctrl.maxDistance=15;
  ctrl.maxPolarAngle=Math.PI*0.52;
  ctrl.target.set(0,1.1,0);ctrl.update();

  /* ===== 灯光 ===== */
  scene.add(new THREE.AmbientLight(0xfff2e0,0.62));
  scene.add(new THREE.HemisphereLight(0x9ab8d8,0x2a1a0a,0.18));
  var sun=new THREE.DirectionalLight(0xfff0d0,0.45);
  sun.position.set(6,12,8);sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.near=0.5;sun.shadow.camera.far=30;
  sun.shadow.camera.left=-10;sun.shadow.camera.right=10;
  sun.shadow.camera.top=10;sun.shadow.camera.bottom=-10;
  sun.shadow.bias=-0.0008;scene.add(sun);
  var rim=new THREE.SpotLight(0xffd080,0.5,22,Math.PI/5,0.5,1);
  rim.position.set(-5,6,-5);
  var rimTgt=new THREE.Object3D();rimTgt.position.set(0,1.2,0);scene.add(rimTgt);
  rim.target=rimTgt;scene.add(rim);
  var fill1=new THREE.PointLight(0x5070ff,0.10,16);fill1.position.set(-5,2.5,6);scene.add(fill1);
  var fill2=new THREE.PointLight(0xffa040,0.10,12);fill2.position.set(0,0.5,3);scene.add(fill2);

  /* ===== 地面：有厚度的土层 + 草面 ===== */
  var GY=0;
  var soil=new THREE.Mesh(new THREE.CylinderGeometry(16,16.5,0.6,64,1),new THREE.MeshStandardMaterial({color:0x5a3a1e,roughness:0.95,metalness:0.02}));
  soil.position.y=GY-0.3;soil.receiveShadow=true;scene.add(soil);
  var soilRim=new THREE.Mesh(new THREE.TorusGeometry(16.25,0.3,8,64),new THREE.MeshStandardMaterial({color:0x4a2a12,roughness:0.95}));
  soilRim.rotation.x=Math.PI/2;soilRim.position.y=GY-0.3;scene.add(soilRim);
  var grassTop=new THREE.Mesh(new THREE.CircleGeometry(16,64),new THREE.MeshStandardMaterial({color:0x2a5a28,roughness:0.92,metalness:0.02}));
  grassTop.rotation.x=-Math.PI/2;grassTop.position.y=GY+0.01;grassTop.receiveShadow=true;scene.add(grassTop);
  var grassEdge=new THREE.Mesh(new THREE.RingGeometry(14,16,64),new THREE.MeshStandardMaterial({color:0x1e4a1e,roughness:0.95}));
  grassEdge.rotation.x=-Math.PI/2;grassEdge.position.y=GY+0.015;scene.add(grassEdge);
  var glow=new THREE.Mesh(new THREE.CircleGeometry(2.8,32),new THREE.MeshBasicMaterial({color:0xf5a623,transparent:true,opacity:0.06,blending:THREE.AdditiveBlending,depthWrite:false}));
  glow.rotation.x=-Math.PI/2;glow.position.y=GY+0.02;scene.add(glow);

  /* ===== 材质工具 ===== */
  function M(c,opts){
    opts=opts||{};
    var p={color:c,roughness:opts.r!==undefined?opts.r:0.7,metalness:opts.m!==undefined?opts.m:0.05};
    if(opts.transparent){p.transparent=true;p.opacity=opts.opacity!==undefined?opts.opacity:1}
    return new THREE.MeshStandardMaterial(p);
  }
  /* r128 兼容肢体（圆柱+两端球）替代 CapsuleGeometry */
  function limb(r,len,mat){
    var g=new THREE.Group();
    var cyl=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,12),mat);
    g.add(cyl);
    var capGeo=new THREE.SphereGeometry(r,12,12);
    var c1=new THREE.Mesh(capGeo,mat);c1.position.y=len/2;g.add(c1);
    var c2=new THREE.Mesh(capGeo,mat);c2.position.y=-len/2;g.add(c2);
    return g;
  }

  /* ==========================================================
     狮小新 —— 严格按图片 1:1
     金黄身体/四肢/尾巴 · 奶油白脸·肚皮·手 · 白耳粉内
     红棕眼鼻·横向张口笑 · 桃粉腮红 · 金黄大球鬃毛环
     额头水滴形橙刘海 · 尾尖红棕水滴 · 坐姿捧腹
     ========================================================== */
  var GOLD=0xf9a825, GOLD2=0xfbb034, GOLD3=0xef9410;
  var CREAM=0xfff8ee, CREAM2=0xfff3e0;
  var REDBROWN=0x9c463a, EYE=0x8a4030, MOUTH=0x9a6a5e;
  var PINK=0xe9b3ad, BLUSH=0xf5c1a6, TAILTIP=0xb4544c;

  var lion=new THREE.Group();scene.add(lion);       // 根（控制整体高度/躺倒）
  var torsoG=new THREE.Group();lion.add(torsoG);    // 躯干（含腹/臂/腿/尾）
  var headG=new THREE.Group();torsoG.add(headG);    // 头

  /* --- 躯干：金黄圆身 --- */
  var torso=new THREE.Mesh(new THREE.SphereGeometry(0.62,40,40),M(GOLD,{r:0.85}));
  torso.position.y=0.60;torso.scale.set(1.0,0.95,0.92);torso.castShadow=true;torsoG.add(torso);
  // 屁股（着地）
  var hip=new THREE.Mesh(new THREE.SphereGeometry(0.48,28,28),M(GOLD,{r:0.85}));
  hip.position.set(0,0.40,-0.12);hip.scale.set(1.05,0.9,0.95);hip.castShadow=true;torsoG.add(hip);
  // 大肚皮：奶油白圆球（图片中最醒目的白肚）
  var bellyMesh=new THREE.Mesh(new THREE.SphereGeometry(0.50,36,36),M(CREAM2,{r:0.9}));
  bellyMesh.position.set(0,0.55,0.30);bellyMesh.scale.set(0.95,0.92,0.62);bellyMesh.castShadow=true;torsoG.add(bellyMesh);

  /* --- 头 --- */
  headG.position.set(0,1.42,0.06);
  var headMesh=new THREE.Mesh(new THREE.SphereGeometry(0.55,44,44),M(CREAM,{r:0.82}));
  headMesh.scale.set(1.02,0.95,0.92);headMesh.castShadow=true;headG.add(headMesh);
  /* 下脸垂肉：脸肥重、肉沉下来的一整条冬瓜形长条（横贯脸宽、两端平滑收细不上扬、底缘垂过下巴） */
  var jowl=new THREE.Mesh(new THREE.SphereGeometry(0.40,32,24),M(CREAM,{r:0.85}));
  jowl.position.set(0,-0.30,0.16);
  jowl.scale.set(1.50,0.78,0.80);
  jowl.castShadow=true;headG.add(jowl);

  /* --- 鬃毛：一圈金黄大圆球（图片样式）+ 内圈增厚 --- */
  var maneG=new THREE.Group();maneG.position.set(0,0.02,-0.10);headG.add(maneG);
  var allMane=[];
  var maneBigGeo=new THREE.SphereGeometry(0.245,16,16);
  var maneMidGeo=new THREE.SphereGeometry(0.20,14,14);
  var i,a;
  for(i=0;i<12;i++){
    a=(i/12)*Math.PI*2;
    var mb=new THREE.Mesh(maneBigGeo,M(GOLD2,{r:0.7}));
    mb.position.set(Math.cos(a)*0.60,Math.sin(a)*0.56,-0.02);
    mb.scale.setScalar(0.9+((i*37)%10)/40);
    mb.castShadow=true;maneG.add(mb);allMane.push(mb);
  }
  for(i=0;i<10;i++){
    a=(i/10)*Math.PI*2+0.3;
    var mm=new THREE.Mesh(maneMidGeo,M(GOLD3,{r:0.72}));
    mm.position.set(Math.cos(a)*0.46,Math.sin(a)*0.44,-0.16);
    mm.scale.setScalar(0.85+((i*53)%10)/45);
    mm.castShadow=true;maneG.add(mm);allMane.push(mm);
  }
  /* 额头水滴形刘海（橙色，尖朝下） */
  var fringeG=new THREE.Group();fringeG.position.set(0,0.42,0.30);fringeG.rotation.x=0.25;headG.add(fringeG);
  var fringeTop=new THREE.Mesh(new THREE.SphereGeometry(0.155,18,18),M(0xff9800,{r:0.6}));
  fringeTop.scale.set(0.8,1.05,0.55);fringeG.add(fringeTop);
  var fringeTip=new THREE.Mesh(new THREE.ConeGeometry(0.115,0.26,14),M(0xf57c00,{r:0.6}));
  fringeTip.position.y=-0.20;fringeTip.rotation.x=Math.PI;fringeTip.scale.set(0.85,1,0.5);fringeG.add(fringeTip);

  /* --- 耳朵：白外圈 + 粉内 --- */
  var earOGeo=new THREE.SphereGeometry(0.15,18,18);
  var earIGeo=new THREE.SphereGeometry(0.085,14,14);
  for(i=-1;i<=1;i+=2){
    var eo=new THREE.Mesh(earOGeo,M(CREAM,{r:0.8}));
    eo.position.set(i*0.42,0.36,-0.02);eo.scale.set(1,1.05,0.55);eo.castShadow=true;headG.add(eo);
    var ei=new THREE.Mesh(earIGeo,M(PINK,{r:0.55}));
    ei.position.set(i*0.42,0.36,0.05);ei.scale.set(0.85,0.9,0.45);headG.add(ei);
  }

  /* --- 眼睛：红棕圆眼 + 双高光 --- */
  for(i=-1;i<=1;i+=2){
    var ew=new THREE.Mesh(new THREE.SphereGeometry(0.085,20,20),M(EYE,{r:0.25,m:0.2}));
    ew.position.set(i*0.21,0.08,0.47);ew.scale.set(1,1.18,0.6);headG.add(ew);
    var h1=new THREE.Mesh(new THREE.SphereGeometry(0.028,10,10),new THREE.MeshBasicMaterial({color:0xffffff}));
    h1.position.set(i*0.185,0.125,0.52);headG.add(h1);
    var h2=new THREE.Mesh(new THREE.SphereGeometry(0.013,8,8),new THREE.MeshBasicMaterial({color:0xffffff}));
    h2.position.set(i*0.24,0.035,0.51);headG.add(h2);
  }

  /* --- 鼻子：红棕椭圆 --- */
  var noseMesh=new THREE.Mesh(new THREE.SphereGeometry(0.058,16,16),M(REDBROWN,{r:0.4}));
  noseMesh.position.set(0,-0.03,0.53);noseMesh.scale.set(1.3,0.85,0.7);headG.add(noseMesh);

  /* --- 嘴：横向张口笑（图片样式） --- */
  var mouthG=new THREE.Group();mouthG.position.set(0,-0.17,0.50);headG.add(mouthG);
  var mouthOuter=new THREE.Mesh(new THREE.SphereGeometry(0.10,18,18),M(MOUTH,{r:0.45}));
  mouthOuter.scale.set(1.55,0.52,0.45);mouthG.add(mouthOuter);
  var mouthInner=new THREE.Mesh(new THREE.SphereGeometry(0.065,14,14),M(0x6a3230,{r:0.4}));
  mouthInner.position.z=0.02;mouthInner.scale.set(1.25,0.42,0.4);mouthG.add(mouthInner);

  /* --- 腮红：桃粉椭圆 --- */
  for(i=-1;i<=1;i+=2){
    var bl=new THREE.Mesh(new THREE.SphereGeometry(0.07,12,12),M(BLUSH,{r:0.5,transparent:true,opacity:0.55}));
    bl.position.set(i*0.345,-0.02,0.42);bl.scale.set(1.35,0.72,0.35);headG.add(bl);
  }

  /* --- 手臂：金黄短臂 + 奶油白圆手（捧腹） --- */
  var armL=new THREE.Group(),armR=new THREE.Group();
  armL.position.set(-0.50,0.86,0.10);armR.position.set(0.50,0.86,0.10);
  torsoG.add(armL);torsoG.add(armR);
  var handGeo=new THREE.SphereGeometry(0.165,20,20);
  function buildArm(g,side){
    var arm=limb(0.105,0.26,M(GOLD,{r:0.85}));
    arm.position.set(0,-0.13,0.06);arm.rotation.x=0.7;
    g.add(arm);
    var hand=new THREE.Mesh(handGeo,M(CREAM,{r:0.88}));
    hand.position.set(side*0.02,-0.30,0.22);hand.scale.set(0.95,0.85,0.9);
    hand.castShadow=true;g.add(hand);
  }
  buildArm(armL,-1);buildArm(armR,1);

  /* --- 腿：金黄大腿 + 大脚掌（含趾沟） --- */
  var legL=new THREE.Group(),legR=new THREE.Group();
  legL.position.set(-0.38,0.34,0.02);legR.position.set(0.38,0.34,0.02);
  torsoG.add(legL);torsoG.add(legR);
  var footGeo=new THREE.SphereGeometry(0.27,22,22);
  var toeGeo=new THREE.BoxGeometry(0.018,0.012,0.13);
  var toeMat=M(0xe08c00,{r:0.8});
  function buildLeg(g){
    var thigh=limb(0.13,0.16,M(GOLD,{r:0.85}));
    thigh.position.set(0,-0.10,0.04);thigh.rotation.x=0.5;g.add(thigh);
    var foot=new THREE.Mesh(footGeo,M(GOLD,{r:0.85}));
    foot.position.set(0,-0.28,0.14);foot.scale.set(0.8,0.62,1.12);
    foot.castShadow=true;g.add(foot);
    var t1=new THREE.Mesh(toeGeo,toeMat);t1.position.set(-0.05,-0.20,0.36);g.add(t1);
    var t2=new THREE.Mesh(toeGeo,toeMat);t2.position.set(0.05,-0.20,0.36);g.add(t2);
  }
  buildLeg(legL);buildLeg(legR);

  /* --- 尾巴：金黄细尾 + 红棕水滴尾尖 --- */
  var tailG=new THREE.Group();tailG.position.set(0.30,0.45,-0.42);torsoG.add(tailG);
  var tailCurve=new THREE.CatmullRomCurve3([
    new THREE.Vector3(0,0,0),
    new THREE.Vector3(0.22,-0.06,-0.28),
    new THREE.Vector3(0.42,0.12,-0.40),
    new THREE.Vector3(0.48,0.38,-0.38)
  ]);
  var tailMesh=new THREE.Mesh(new THREE.TubeGeometry(tailCurve,24,0.045,10,false),M(GOLD,{r:0.85}));
  tailMesh.castShadow=true;tailG.add(tailMesh);
  var tipG=new THREE.Group();tipG.position.set(0.48,0.44,-0.38);tailG.add(tipG);
  var tipBall=new THREE.Mesh(new THREE.SphereGeometry(0.105,16,16),M(TAILTIP,{r:0.6}));
  tipBall.scale.set(0.85,1.15,0.85);tipG.add(tipBall);
  var tipPoint=new THREE.Mesh(new THREE.ConeGeometry(0.075,0.16,12),M(TAILTIP,{r:0.6}));
  tipPoint.position.y=0.15;tipG.add(tipPoint);

  /* ==========================================================
     环境：高树（与狮子等高）+ 叶片细节
     ========================================================== */
  function makeTree(x,z,sc){
    sc=sc||1;var g=new THREE.Group();var tH=1.9*sc;
    var trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.045*sc,0.11*sc,tH,10),M(0x5a3a22,{r:0.92}));
    trunk.position.y=tH/2;trunk.castShadow=true;g.add(trunk);
    var bi,bAngle,bLen,bY,branch;
    var bn=2+Math.floor(Math.random()*2);
    for(bi=0;bi<bn;bi++){
      bAngle=Math.random()*Math.PI*2;bLen=(0.3+Math.random()*0.3)*sc;bY=tH*0.4+Math.random()*tH*0.35;
      branch=new THREE.Mesh(new THREE.CylinderGeometry(0.012*sc,0.026*sc,bLen,6),M(0x4a3020,{r:0.92}));
      branch.position.set(Math.cos(bAngle)*bLen*0.4,bY,Math.sin(bAngle)*bLen*0.4);
      branch.rotation.z=Math.cos(bAngle)*0.6;branch.rotation.x=Math.sin(bAngle)*0.3;
      branch.castShadow=true;g.add(branch);
    }
    var greens=[0x1e5a28,0x2a6a38,0x3a7a48,0x2e6030,0x4a8a58,0x1a4a20,0x357040];
    var ci,cr,cAngle,cDist,cY,crown;
    var cl=5+Math.floor(Math.random()*3);
    for(ci=0;ci<cl;ci++){
      cr=(0.40-ci*0.038)*sc;if(cr<0.08)continue;
      cAngle=(ci/cl)*Math.PI*2+Math.random()*0.8;cDist=ci*0.05*sc;
      cY=tH+cr*0.3+ci*cr*0.38;
      crown=new THREE.Mesh(new THREE.IcosahedronGeometry(cr,1),M(greens[ci%greens.length],{r:0.85}));
      crown.position.set(Math.cos(cAngle)*cDist,cY,Math.sin(cAngle)*cDist);
      crown.rotation.set(Math.random(),Math.random(),Math.random());
      crown.castShadow=true;g.add(crown);
    }
    var leafGeo=new THREE.ConeGeometry(0.026*sc,0.085*sc,4);
    var leafMats=[M(0x2a7a3a,{r:0.8}),M(0x3a8a4a,{r:0.8}),M(0x1e6a2e,{r:0.8})];
    var lfi,la,lr,ly,leaf;
    var ln=26+Math.floor(Math.random()*16);
    for(lfi=0;lfi<ln;lfi++){
      la=Math.random()*Math.PI*2;lr=(0.2+Math.random()*0.28)*sc;
      ly=tH+0.3*sc+Math.random()*cl*0.16*sc;
      leaf=new THREE.Mesh(leafGeo,leafMats[lfi%leafMats.length]);
      leaf.position.set(Math.cos(la)*lr,ly,Math.sin(la)*lr);
      leaf.rotation.set((Math.random()-0.5)*1.2,Math.random()*Math.PI,(Math.random()-0.5)*0.8);
      g.add(leaf);
    }
    g.position.set(x,GY,z);return g;
  }
  var treePositions=[
    [-3.2,-2.0,1.1],[-2.5,2.5,1.0],[2.8,-1.8,1.05],[3.2,2.0,0.95],
    [-3.8,0.6,0.85],[4.0,-0.5,0.8],[-1.8,-3.2,0.75],[2.0,3.0,0.8],
    [0.5,-3.8,0.7],[-3.5,-2.8,0.65],[3.5,2.8,0.7],[0.2,3.8,0.65],
    [-4.5,1.5,0.6],[4.2,1.0,0.55],[-1.0,-4.0,0.5]
  ];
  for(i=0;i<treePositions.length;i++){scene.add(makeTree(treePositions[i][0],treePositions[i][1],treePositions[i][2]))}

  /* ===== 石头 ===== */
  function makeRock(x,z,s){
    s=s||1;
    var geo=new THREE.IcosahedronGeometry(0.15,1);
    var pos=geo.attributes.position,ri2;
    for(ri2=0;ri2<pos.count;ri2++){
      pos.setX(ri2,pos.getX(ri2)*(0.6+Math.random()*0.8));
      pos.setY(ri2,pos.getY(ri2)*(0.4+Math.random()*0.5));
      pos.setZ(ri2,pos.getZ(ri2)*(0.6+Math.random()*0.8));
    }
    geo.computeVertexNormals();
    var rCols=[0x556677,0x667788,0x4a5a6a,0x788898,0x5a6a7a,0x4a5a68];
    var rock=new THREE.Mesh(geo,M(rCols[Math.floor(Math.random()*rCols.length)],{r:0.94}));
    rock.position.set(x,GY+0.06*s,z);rock.scale.setScalar(s);
    rock.rotation.set(Math.random()*0.4,Math.random()*Math.PI,Math.random()*0.4);
    rock.castShadow=true;rock.receiveShadow=true;return rock;
  }
  var rockPositions=[
    [1.6,0.9,1.2],[-1.3,1.3,0.9],[2.2,-1.1,1.0],[-1.9,-1.6,0.8],
    [0.9,-2.1,0.95],[-2.6,0.3,0.7],[2.9,0.4,0.85],[-0.6,2.6,0.6],
    [1.1,-2.6,0.75],[-2.9,-0.9,0.55],[0.4,1.9,0.45],[-1.1,-2.9,0.65],
    [3.1,-1.3,0.5],[-3.1,1.9,0.45],[1.8,1.6,0.6],[-2.2,-2.4,0.5]
  ];
  for(i=0;i<rockPositions.length;i++){scene.add(makeRock(rockPositions[i][0],rockPositions[i][1],rockPositions[i][2]))}
  function makePile(x,z){
    var g=new THREE.Group(),pi2;
    for(pi2=0;pi2<5;pi2++){g.add(makeRock(Math.random()*0.4-0.2,Math.random()*0.4-0.2,0.25+Math.random()*0.45))}
    g.position.set(x,GY,z);return g;
  }
  scene.add(makePile(2.0,1.2));scene.add(makePile(-1.6,-1.1));scene.add(makePile(2.6,-2.1));

  /* ===== 草丛 / 小花 / 蘑菇 ===== */
  var grassMats=[M(0x3a7a3a,{r:0.85}),M(0x4a8a4a,{r:0.85}),M(0x2a6a2a,{r:0.85}),M(0x5a9a5a,{r:0.85})];
  function makeGrassTuft(x,z){
    var g=new THREE.Group(),n=4+Math.floor(Math.random()*5),gi2,h,blade;
    for(gi2=0;gi2<n;gi2++){
      h=0.1+Math.random()*0.25;
      blade=new THREE.Mesh(new THREE.ConeGeometry(0.012,h,4),grassMats[gi2%grassMats.length]);
      blade.position.set((Math.random()-0.5)*0.14,h/2,(Math.random()-0.5)*0.14);
      blade.rotation.z=(Math.random()-0.5)*0.4;blade.rotation.y=Math.random()*Math.PI;
      g.add(blade);
    }
    g.position.set(x,GY,z);return g;
  }
  for(i=0;i<60;i++){var ga=Math.random()*Math.PI*2,gd=1.0+Math.random()*6;scene.add(makeGrassTuft(Math.cos(ga)*gd,Math.sin(ga)*gd))}
  function makeFlower(x,z){
    var g=new THREE.Group();
    var stem=new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.01,0.15,5),M(0x3a7a3a,{r:0.8}));
    stem.position.y=0.075;g.add(stem);
    var petalGeo=new THREE.SphereGeometry(0.03,8,8);
    var petalCols=[0xf5e0e0,0xe0e0f5,0xf5f0d0,0xf0d0e0];
    var pc=petalCols[Math.floor(Math.random()*petalCols.length)],pi3,pa,petal;
    for(pi3=0;pi3<5;pi3++){
      pa=(pi3/5)*Math.PI*2;
      petal=new THREE.Mesh(petalGeo,M(pc,{r:0.5}));
      petal.position.set(Math.cos(pa)*0.025,0.16,Math.sin(pa)*0.025);
      petal.scale.set(1,0.6,1);g.add(petal);
    }
    var center=new THREE.Mesh(new THREE.SphereGeometry(0.015,8,8),M(0xf5d040,{r:0.4}));
    center.position.y=0.16;g.add(center);
    g.position.set(x,GY,z);return g;
  }
  var flowerPositions=[[1.5,1.8],[-2.0,0.8],[0.8,-2.3],[-1.5,-2.0],[2.5,0.5],[-2.8,1.5],[3.0,-0.8],[-0.5,2.8]];
  for(i=0;i<flowerPositions.length;i++){scene.add(makeFlower(flowerPositions[i][0],flowerPositions[i][1]))}
  function makeShroom(x,z,s){
    s=s||1;var g=new THREE.Group();
    var stem=new THREE.Mesh(new THREE.CylinderGeometry(0.02*s,0.028*s,0.1*s,7),M(0xf0e8d0,{r:0.8}));
    stem.position.y=0.05*s;g.add(stem);
    var cap=new THREE.Mesh(new THREE.SphereGeometry(0.055*s,12,12),M(0xd04040,{r:0.55}));
    cap.position.y=0.115*s;cap.scale.set(1,0.5,1);g.add(cap);
    var si2,sa,spot;
    for(si2=0;si2<3;si2++){
      sa=Math.random()*Math.PI*2;
      spot=new THREE.Mesh(new THREE.SphereGeometry(0.012*s,6,6),M(0xffffff,{r:0.3}));
      spot.position.set(Math.cos(sa)*0.03*s,0.13*s,Math.sin(sa)*0.03*s);g.add(spot);
    }
    g.position.set(x,GY,z);return g;
  }
  scene.add(makeShroom(1.3,1.6,0.9));scene.add(makeShroom(-1.9,0.7,0.65));
  scene.add(makeShroom(0.6,-2.3,0.75));scene.add(makeShroom(-2.3,-1.9,0.55));

  /* ===== 萤火虫 ===== */
  var ffN=160,ffPos=new Float32Array(ffN*3),ffMeta=[],ffi,fth,fr;
  for(ffi=0;ffi<ffN;ffi++){
    fth=Math.random()*Math.PI*2;fr=2+Math.random()*6;
    ffPos[ffi*3]=Math.cos(fth)*fr;ffPos[ffi*3+1]=0.4+Math.random()*4;ffPos[ffi*3+2]=Math.sin(fth)*fr;
    ffMeta.push({sp:0.12+Math.random()*0.5,ph:Math.random()*Math.PI*2,r:fr,th:fth});
  }
  var ffGeo=new THREE.BufferGeometry();
  ffGeo.setAttribute('position',new THREE.BufferAttribute(ffPos,3));
  var ffMat=new THREE.PointsMaterial({color:0xffeebb,size:0.08,transparent:true,opacity:0.7,sizeAttenuation:true,blending:THREE.AdditiveBlending,depthWrite:false});
  scene.add(new THREE.Points(ffGeo,ffMat));

  /* ==========================================================
     动作系统：站立 / 晒肚皮 / 捧腹大笑（默认=图片坐姿捧腹）
     参数：rootY 整体高度 · torsoRX 躯干俯仰
           headY/headZ 头沿颈部与局部前后的位移（躺姿解算得出，避免头陷入躯干）
           headRX 头俯仰补偿 · headRZ 头侧倾
           legRX 腿摆动 · legSpread 腿间距 · armRX 手臂
           bellyZ/bellySZ 肚皮前推与鼓起 · tailLift 尾巴上翘
     躺姿几何：torsoRX=-1.50 时躯干局部+z 指向世界上方，
     头需 headZ=-0.18 才能让后脑勺落到地面高度，同时 headY≈1.44 保持颈部长度自然。
     ========================================================== */
  var POSES={
    standing:{rootY:0.14,torsoRX:0.02,headY:1.42,headZ:0.06,headRX:0.0,headRZ:0,legRX:-0.06,legSpread:0.30,armRX:-0.25,bellyZ:0.30,bellySZ:0.62,tailLift:0,laughAmp:0},
    lying:{rootY:0.52,torsoRX:-1.50,headY:1.68,headZ:-0.14,headRX:0.30,headRZ:0.16,legRX:-1.60,legSpread:0.50,armRX:-1.25,bellyZ:0.42,bellySZ:0.72,tailLift:1.30,laughAmp:0},
    laughing:{rootY:0.03,torsoRX:-0.10,headY:1.42,headZ:0.06,headRX:0.06,headRZ:0,legRX:-0.62,legSpread:0.40,armRX:-0.55,bellyZ:0.34,bellySZ:0.66,tailLift:0.15,laughAmp:1}
  };
  var curPose='laughing';
  var cur={rootY:0.03,torsoRX:-0.10,headY:1.42,headZ:0.06,headRX:0.06,headRZ:0,legRX:-0.62,legSpread:0.40,armRX:-0.55,bellyZ:0.34,bellySZ:0.66,tailLift:0.15,laughAmp:1};
  var tgt={rootY:0.03,torsoRX:-0.10,headY:1.42,headZ:0.06,headRX:0.06,headRZ:0,legRX:-0.62,legSpread:0.40,armRX:-0.55,bellyZ:0.34,bellySZ:0.66,tailLift:0.15,laughAmp:1};

  function setPose(name){
    curPose=name;
    var p=POSES[name],k;
    for(k in p){tgt[k]=p[k]}
    var btns=document.querySelectorAll('.pbtn'),bi2;
    for(bi2=0;bi2<btns.length;bi2++){
      if(btns[bi2].getAttribute('data-pose')===name){btns[bi2].classList.add('active')}
      else{btns[bi2].classList.remove('active')}
    }
    spawnBurst();
  }
  var btns=document.querySelectorAll('.pbtn'),bi3;
  for(bi3=0;bi3<btns.length;bi3++){
    btns[bi3].addEventListener('click',function(e){setPose(e.target.getAttribute('data-pose'))});
  }

  /* ===== 粒子爆发 ===== */
  var burstPts=null,burstLife=0;
  function spawnBurst(){
    if(burstPts){scene.remove(burstPts);burstPts.geometry.dispose()}
    var n=250,bPos=new Float32Array(n*3),bVel=[],bi4,th,ph,sp;
    for(bi4=0;bi4<n;bi4++){
      bPos[bi4*3]=0;bPos[bi4*3+1]=cur.rootY+1.5;bPos[bi4*3+2]=0.2;
      th=Math.random()*Math.PI*2;ph=Math.random()*Math.PI;sp=1.8+Math.random()*3.5;
      bVel.push(Math.sin(ph)*Math.cos(th)*sp,Math.sin(ph)*Math.sin(th)*sp+1.5,Math.cos(ph)*sp);
    }
    var bGeo=new THREE.BufferGeometry();
    bGeo.setAttribute('position',new THREE.BufferAttribute(bPos,3));
    burstPts=new THREE.Points(bGeo,new THREE.PointsMaterial({color:0xffd080,size:0.1,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));
    burstPts.userData.vel=bVel;scene.add(burstPts);burstLife=1;
  }

  /* ===== 动画循环 ===== */
  var clock=new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    var dt=Math.min(clock.getDelta(),0.05);
    var t=clock.getElapsedTime();
    var sp=3.5,k;

    for(k in tgt){cur[k]+=(tgt[k]-cur[k])*sp*dt}

    lion.position.y=cur.rootY;
    torsoG.rotation.x=cur.torsoRX;
    headG.position.set(0,cur.headY,cur.headZ);
    headG.rotation.x=cur.headRX;
    headG.rotation.z=cur.headRZ;
    legL.rotation.x=cur.legRX;legR.rotation.x=cur.legRX;
    legL.position.x=-cur.legSpread-0.02;legR.position.x=cur.legSpread+0.02;
    armL.rotation.x=cur.armRX;armR.rotation.x=cur.armRX;
    bellyMesh.position.z=cur.bellyZ;
    bellyMesh.scale.set(0.95,0.92,cur.bellySZ);
    tailG.rotation.x=cur.tailLift;

    /* 呼吸 */
    var breathe=Math.sin(t*1.3)*0.018;
    lion.position.y+=breathe;
    torso.scale.set(1.0+breathe*0.6,0.95,0.92+breathe*0.6);

    /* 捧腹大笑：抖动 + 嘴张合 */
    if(cur.laughAmp>0.05){
      lion.position.y+=Math.sin(t*9)*0.03*cur.laughAmp;
      headG.rotation.x+=Math.sin(t*7.5)*0.07*cur.laughAmp;
      headG.rotation.z+=Math.sin(t*6.5)*0.04*cur.laughAmp;
      var mo=1+Math.sin(t*10)*0.18*cur.laughAmp;
      mouthG.scale.set(1,mo,1);
    }else{
      mouthG.scale.set(1,1,1);
    }

    /* 晒肚皮：身体微晃 */
    if(curPose==='lying'){
      torsoG.rotation.z=Math.sin(t*0.8)*0.03;
    }else{
      torsoG.rotation.z*=0.9;
    }

    /* 站立时轻微左右看 */
    if(curPose==='standing'){
      headG.rotation.y=Math.sin(t*0.45)*0.08;
    }else{
      headG.rotation.y*=0.92;
    }

    /* 尾巴摆动 */
    tailG.rotation.y=Math.sin(t*2.6)*0.18;
    tailG.rotation.z=Math.sin(t*2.0)*0.08;

    /* 鬃毛呼吸 + 非默认时发光 */
    var maneTgt=curPose==='lying'?1.12:curPose==='laughing'?1.06:1.0;
    var maneNow=maneG.scale.x+(maneTgt-maneG.scale.x)*dt*2.5;
    maneG.scale.set(maneNow,maneNow,maneNow);
    maneG.rotation.z=Math.sin(t*0.6)*0.02;
    if(curPose!=='standing'){
      var mi2,mp;
      for(mi2=0;mi2<allMane.length;mi2++){
        mp=allMane[mi2];
        if(!mp.userData._cm){mp.material=mp.material.clone();mp.userData._cm=true}
        mp.material.emissive=new THREE.Color(0xffa040);
        mp.material.emissiveIntensity=0.08+Math.sin(t*2.5+mi2*0.12)*0.06;
      }
    }

    /* 萤火虫 */
    var fp=ffGeo.attributes.position.array,fi3,d;
    for(fi3=0;fi3<ffN;fi3++){
      d=ffMeta[fi3];d.th+=d.sp*dt*0.3;
      fp[fi3*3]=Math.cos(d.th)*d.r;
      fp[fi3*3+1]+=Math.sin(t*d.sp+d.ph)*dt*0.25;
      fp[fi3*3+2]=Math.sin(d.th)*d.r;
      if(fp[fi3*3+1]<0.3)fp[fi3*3+1]=0.3;
      if(fp[fi3*3+1]>4.5)fp[fi3*3+1]=4.5;
    }
    ffGeo.attributes.position.needsUpdate=true;
    ffMat.opacity=0.4+Math.sin(t*1.2)*0.3;

    /* 爆发粒子 */
    if(burstPts&&burstLife>0){
      burstLife-=dt*0.7;
      burstPts.material.opacity=Math.max(0,burstLife);
      var bp=burstPts.geometry.attributes.position.array;
      var bv=burstPts.userData.vel,bi5;
      for(bi5=0;bi5<bp.length/3;bi5++){
        bp[bi5*3]+=bv[bi5*3]*dt;
        bp[bi5*3+1]+=bv[bi5*3+1]*dt;
        bp[bi5*3+2]+=bv[bi5*3+2]*dt;
        bv[bi5*3+1]-=3*dt;
      }
      burstPts.geometry.attributes.position.needsUpdate=true;
      if(burstLife<=0){scene.remove(burstPts);burstPts.geometry.dispose();burstPts=null}
    }

    ctrl.update();
    R.render(scene,cam);
  }

  window.addEventListener('resize',function(){
    cam.aspect=window.innerWidth/window.innerHeight;
    cam.updateProjectionMatrix();
    R.setSize(window.innerWidth,window.innerHeight);
  });

  st.textContent='场景就绪！';
  setTimeout(function(){
    document.getElementById('loader').classList.add('hide');
    document.getElementById('ui').classList.add('show');
  },600);

  animate();
}
</script>
</body>
