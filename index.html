<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>狮小新 · 肚皮向阳</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#080c18;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#fff}
#loader{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#1a1e38 0%,#080c18 70%);transition:opacity 1s ease}
#loader.hide{opacity:0;pointer-events:none}
.loader-char{font-size:72px;color:#d4a24e;text-shadow:0 0 40px rgba(212,162,78,.5);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.1);opacity:1}}
#loader-status{margin-top:20px;font-size:13px;letter-spacing:3px;color:rgba(255,255,255,.4)}
#canvas-wrap{position:fixed;inset:0;z-index:1}
canvas{display:block}
#ui{position:fixed;bottom:0;left:0;right:0;z-index:10;pointer-events:none;padding:0 24px 48px;text-align:center}
#ui h1{font-size:clamp(28px,5vw,48px);font-weight:700;letter-spacing:6px;text-shadow:0 0 30px rgba(212,162,78,.4);margin-bottom:14px;opacity:0;transform:translateY(24px);transition:all 1.2s cubic-bezier(.23,1,.32,1) .3s}
#ui .hint{font-size:clamp(12px,1.8vw,15px);letter-spacing:3px;opacity:0;transform:translateY(16px);transition:all 1.2s cubic-bezier(.23,1,.32,1) .6s;color:rgba(255,255,255,.55);margin-bottom:10px}
#ui .tagline{font-size:clamp(13px,2vw,16px);letter-spacing:4px;opacity:0;transform:translateY(16px);transition:all 1.2s cubic-bezier(.23,1,.32,1) .9s;color:rgba(255,255,255,.4)}
#ui.show h1,#ui.show .hint,#ui.show .tagline{opacity:1;transform:translateY(0)}
#pose-tip{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:10;font-size:13px;letter-spacing:2px;padding:6px 18px;border-radius:20px;background:rgba(212,162,78,.15);border:1px solid rgba(212,162,78,.25);opacity:0;transition:opacity .4s ease;pointer-events:none}
#pose-tip.show{opacity:1}
@media(max-width:600px){#ui{padding:0 16px 32px}}
</style>
</head>
<body>

<div id="loader">
  <div class="loader-char">狮</div>
  <div id="loader-status">正在加载 3D 引擎…</div>
</div>
<div id="canvas-wrap"></div>
<div id="pose-tip"></div>

<div id="ui">
  <h1>肚皮交给太阳</h1>
  <p class="hint">嗷呜放放了放了嘛，小新国庆就天天在地上晒肚皮，这假期过得比谁都标准嗷～</p>
  <p class="tagline">肚皮朝天 · 诸事不管</p>
</div>

<!-- 第一步：按顺序尝试多个 CDN 加载 three.js -->
<script>
(function(){
  var sources = [
    {name:'npmmirror',  three:'https://registry.npmmirror.com/three/0.128.0/files/build/three.min.js',  controls:'https://registry.npmmirror.com/three/0.128.0/files/examples/js/controls/OrbitControls.js'},
    {name:'unpkg',      three:'https://unpkg.com/three@0.128.0/build/three.min.js',                     controls:'https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js'},
    {name:'jsdelivr',   three:'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',          controls:'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js'},
    {name:'bootcdn',    three:'https://cdn.bootcdn.net/ajax/libs/three.js/r128/three.min.js'}
  ];
  var statusEl = document.getElementById('loader-status');
  var idx = 0;

  function loadScript(url, timeout) {
    return new Promise(function(resolve) {
      var s = document.createElement('script');
      var done = false;
      var timer = setTimeout(function(){ if(!done){done=true; s.onload=s.onerror=null; resolve(false)} }, timeout);
      s.onload = function(){ if(!done){done=true; clearTimeout(timer); resolve(true)} };
      s.onerror = function(){ if(!done){done=true; clearTimeout(timer); resolve(false)} };
      s.src = url;
      document.head.appendChild(s);
    });
  }

  function tryNext() {
    if (idx >= sources.length) {
      statusEl.textContent = '所有加载源均失败，请检查网络后刷新';
      return;
    }
    var src = sources[idx];
    statusEl.textContent = '加载引擎中… (' + (idx+1) + '/' + sources.length + ')';

    loadScript(src.three, 8000).then(function(ok) {
      if (ok && typeof THREE !== 'undefined') {
        // three.js 加载成功，尝试加载 OrbitControls
        if (src.controls) {
          loadScript(src.controls, 5000).then(function(cOk) {
            if (cOk && typeof THREE.OrbitControls !== 'undefined') {
              statusEl.textContent = '引擎就绪，搭建场景…';
              initScene();
            } else {
              // controls 失败但 three 成功，用内联 controls
              statusEl.textContent = '控制器备用加载…';
              initScene();
            }
          });
        } else {
          statusEl.textContent = '引擎就绪，搭建场景…';
          initScene();
        }
      } else {
        idx++;
        tryNext();
      }
    });
  }

  tryNext();
})();
</script>

<!-- 第二步：场景主逻辑 -->
<script>
function initScene() {
  var wrap = document.getElementById('canvas-wrap');
  var statusEl = document.getElementById('loader-status');

  // ========== 渲染器 ==========
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  wrap.appendChild(renderer.domElement);

  // ========== 场景 & 相机 ==========
  var scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x080c18, 0.022);

  var camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 3, 8);

  // ========== 控制器 ==========
  var controls;
  if (typeof THREE.OrbitControls !== 'undefined') {
    controls = new THREE.OrbitControls(camera, renderer.domElement);
  } else {
    // 内联简易轨道控制器
    controls = createInlineControls(camera, renderer.domElement);
  }
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 3;
  controls.maxDistance = 14;
  controls.maxPolarAngle = Math.PI * 0.55;
  controls.target.set(0, 1.2, 0);
  controls.update();

  // ========== 灯光 ==========
  scene.add(new THREE.AmbientLight(0x7888b8, 0.55));

  var sunLight = new THREE.DirectionalLight(0xfff0d0, 2.0);
  sunLight.position.set(5, 10, 6);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(2048, 2048);
  sunLight.shadow.camera.near = 0.5;
  sunLight.shadow.camera.far = 25;
  sunLight.shadow.camera.left = -8;
  sunLight.shadow.camera.right = 8;
  sunLight.shadow.camera.top = 8;
  sunLight.shadow.camera.bottom = -8;
  sunLight.shadow.bias = -0.001;
  scene.add(sunLight);

  var rim = new THREE.SpotLight(0xffd080, 3, 20, Math.PI / 5, 0.5, 1);
  rim.position.set(-4, 5, -4);
  var rimTarget = new THREE.Object3D();
  rimTarget.position.set(0, 1, 0);
  scene.add(rimTarget);
  rim.target = rimTarget;
  scene.add(rim);

  var fill1 = new THREE.PointLight(0x5070ff, 0.5, 14);
  fill1.position.set(-4, 2, 5);
  scene.add(fill1);

  var fill2 = new THREE.PointLight(0xffa040, 0.4, 10);
  fill2.position.set(0, 0.3, 2);
  scene.add(fill2);

  // ========== 地面 ==========
  var groundMat = new THREE.MeshStandardMaterial({ color: 0x162030, roughness: 0.92, metalness: 0.05 });
  var ground = new THREE.Mesh(new THREE.CircleGeometry(15, 64), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // 脚下暖光
  var glowMat = new THREE.MeshBasicMaterial({ color: 0xd4a24e, transparent: true, opacity: 0.04, blending: THREE.AdditiveBlending, depthWrite: false });
  var glowMesh = new THREE.Mesh(new THREE.CircleGeometry(2.5, 32), glowMat);
  glowMesh.rotation.x = -Math.PI / 2;
  glowMesh.position.y = 0.01;
  scene.add(glowMesh);

  // ========== 材质工具 ==========
  function makeMat(color, opts) {
    opts = opts || {};
    return new THREE.MeshStandardMaterial({
      color: color,
      roughness: opts.r !== undefined ? opts.r : 0.7,
      metalness: opts.m !== undefined ? opts.m : 0.05,
      transparent: opts.transparent || false,
      opacity: opts.opacity !== undefined ? opts.opacity : 1.0
    });
  }

  // ==========================================================
  //                    狮小新模型
  //  严格按图片：白奶油身体/脸、蓬松金色鬃毛环、粉耳内、
  //  金爪、深色眼睛+白高光、粉色鼻头、微笑弧线、卷尾金尖
  // ==========================================================
  var lion = new THREE.Group();
  scene.add(lion);
  var bodyGroup = new THREE.Group();
  lion.add(bodyGroup);

  // --- 身体：白色蓬松椭球 ---
  var bodyMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.62, 32, 32),
    makeMat(0xfaf6ee, { r: 0.88 })
  );
  bodyMesh.position.y = 0.7;
  bodyMesh.scale.set(1, 0.88, 0.85);
  bodyMesh.castShadow = true;
  bodyGroup.add(bodyMesh);

  // 肚皮（更白更亮）
  var bellyMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.42, 24, 24),
    makeMat(0xffffff, { r: 0.92 })
  );
  bellyMesh.position.set(0, 0.62, 0.28);
  bellyMesh.scale.set(1, 0.85, 0.65);
  bodyGroup.add(bellyMesh);

  // --- 头 ---
  var headGroup = new THREE.Group();
  headGroup.position.set(0, 1.72, 0.18);
  bodyGroup.add(headGroup);

  var headMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.54, 32, 32),
    makeMat(0xfcf8f0, { r: 0.82 })
  );
  headMesh.scale.set(1, 0.92, 0.9);
  headMesh.castShadow = true;
  headGroup.add(headMesh);

  // --- 鬃毛：4 层蓬松金环，严格还原图片 ---
  var maneGroup = new THREE.Group();
  headGroup.add(maneGroup);
  var maneSphereGeo = new THREE.SphereGeometry(0.17, 10, 10);
  var maneColors = [0xe8c060, 0xdab050, 0xd0a040, 0xc49838];
  var maneRadii  = [0.52, 0.66, 0.78, 0.88];
  var maneSizeMul= [1.0,  0.88, 0.72, 0.55];
  var maneCounts = [12, 15, 18, 10];
  var allManeParts = [];

  for (var layer = 0; layer < 4; layer++) {
    var count = maneCounts[layer];
    for (var i = 0; i < count; i++) {
      var angle = (i / count) * Math.PI * 2 + (layer % 2) * (Math.PI / count);
      var radius = maneRadii[layer];
      var piece = new THREE.Mesh(maneSphereGeo, makeMat(maneColors[layer], { r: 0.72 }));
      piece.position.set(
        Math.cos(angle) * radius,
        Math.sin(angle) * radius * 0.82,
        -0.04 - layer * 0.03
      );
      var sc = maneSizeMul[layer] * (0.88 + Math.random() * 0.25);
      piece.scale.set(sc, sc, sc);
      piece.castShadow = true;
      maneGroup.add(piece);
      allManeParts.push(piece);
    }
  }

  // --- 耳朵：金色外 + 粉色内 ---
  var earGeo = new THREE.SphereGeometry(0.13, 14, 14);
  var earInnerGeo = new THREE.SphereGeometry(0.075, 12, 12);
  for (var side = -1; side <= 1; side += 2) {
    var ear = new THREE.Mesh(earGeo, makeMat(0xd4a24e, { r: 0.78 }));
    ear.position.set(side * 0.42, 0.4, 0.02);
    ear.scale.set(1, 1.25, 0.55);
    headGroup.add(ear);

    var earIn = new THREE.Mesh(earInnerGeo, makeMat(0xf0a0a8, { r: 0.6 }));
    earIn.position.set(side * 0.42, 0.4, 0.07);
    earIn.scale.set(0.85, 1.05, 0.5);
    headGroup.add(earIn);
  }

  // --- 眼睛 ---
  for (var side = -1; side <= 1; side += 2) {
    var eyeWhite = new THREE.Mesh(
      new THREE.SphereGeometry(0.09, 14, 14),
      makeMat(0xffffff, { r: 0.25 })
    );
    eyeWhite.position.set(side * 0.2, 0.06, 0.5);
    headGroup.add(eyeWhite);

    var pupil = new THREE.Mesh(
      new THREE.SphereGeometry(0.058, 14, 14),
      makeMat(0x18182e, { r: 0.15, m: 0.35 })
    );
    pupil.position.set(side * 0.2, 0.06, 0.56);
    headGroup.add(pupil);

    var highlight = new THREE.Mesh(
      new THREE.SphereGeometry(0.02, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    highlight.position.set(side * 0.18, 0.09, 0.59);
    headGroup.add(highlight);
  }

  // --- 鼻子 ---
  var noseMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.05, 12, 12),
    makeMat(0xc88898, { r: 0.45 })
  );
  noseMesh.position.set(0, -0.06, 0.52);
  noseMesh.scale.set(1.3, 0.75, 0.75);
  headGroup.add(noseMesh);

  // --- 微笑嘴巴（弧线） ---
  var smileCurve = new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(-0.1, -0.13, 0.5),
    new THREE.Vector3(0, -0.17, 0.52),
    new THREE.Vector3(0.1, -0.13, 0.5)
  );
  var smileMesh = new THREE.Mesh(
    new THREE.TubeGeometry(smileCurve, 16, 0.011, 8, false),
    new THREE.MeshBasicMaterial({ color: 0x6b4a3a })
  );
  headGroup.add(smileMesh);

  // --- 大笑嘴（点击切换时显示） ---
  var laughMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.09, 14, 14),
    makeMat(0xd06060, { r: 0.45 })
  );
  laughMesh.position.set(0, -0.16, 0.5);
  laughMesh.scale.set(1.3, 0.7, 0.8);
  laughMesh.visible = false;
  headGroup.add(laughMesh);

  // --- 腮红 ---
  for (var side = -1; side <= 1; side += 2) {
    var blush = new THREE.Mesh(
      new THREE.SphereGeometry(0.065, 10, 10),
      makeMat(0xf5b8b8, { r: 0.5, transparent: true, opacity: 0.35 })
    );
    blush.position.set(side * 0.32, -0.02, 0.46);
    headGroup.add(blush);
  }

  // --- 前爪：金色 ---
  var pawGeo = new THREE.SphereGeometry(0.14, 14, 14);
  for (var side = -1; side <= 1; side += 2) {
    var paw = new THREE.Mesh(pawGeo, makeMat(0xd4a24e, { r: 0.82 }));
    paw.position.set(side * 0.34, 0.12, 0.38);
    paw.scale.set(1, 0.65, 1.2);
    paw.castShadow = true;
    bodyGroup.add(paw);
  }

  // --- 后腿：金色 ---
  for (var side = -1; side <= 1; side += 2) {
    var leg = new THREE.Mesh(
      new THREE.CylinderGeometry(0.1, 0.1, 0.28, 12),
      makeMat(0xd4a24e, { r: 0.82 })
    );
    leg.position.set(side * 0.42, 0.18, -0.22);
    leg.castShadow = true;
    bodyGroup.add(leg);

    var foot = new THREE.Mesh(pawGeo, makeMat(0xd4a24e, { r: 0.82 }));
    foot.position.set(side * 0.45, 0.06, -0.2);
    foot.scale.set(1, 0.55, 1.15);
    bodyGroup.add(foot);
  }

  // --- 尾巴：曲线 + 金色蓬松尖 ---
  var tailCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 0.55, -0.45),
    new THREE.Vector3(0.05, 0.4, -0.85),
    new THREE.Vector3(0.18, 0.6, -1.15),
    new THREE.Vector3(0.12, 0.88, -1.3)
  ]);
  var tailMesh = new THREE.Mesh(
    new THREE.TubeGeometry(tailCurve, 24, 0.05, 8, false),
    makeMat(0xf0e8d8, { r: 0.85 })
  );
  tailMesh.castShadow = true;
  bodyGroup.add(tailMesh);

  var tailTip = new THREE.Mesh(
    new THREE.SphereGeometry(0.11, 12, 12),
    makeMat(0xd4a24e, { r: 0.72 })
  );
  tailTip.position.set(0.12, 0.88, -1.3);
  bodyGroup.add(tailTip);

  // ==========================================================
  //                    环境：高树（与狮子等高）
  // ==========================================================
  function makeTree(x, z, scale) {
    scale = scale || 1;
    var group = new THREE.Group();
    var trunkH = 1.6 * scale;

    var trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.05 * scale, 0.09 * scale, trunkH, 8),
      makeMat(0x5a3a28, { r: 0.92 })
    );
    trunk.position.y = trunkH / 2;
    trunk.castShadow = true;
    group.add(trunk);

    var greens = [0x2a5a38, 0x3a6a48, 0x1e4a2e, 0x4a7a58, 0x357045];
    var layers = 4 + Math.floor(Math.random() * 2);
    for (var i = 0; i < layers; i++) {
      var r = (0.32 - i * 0.04) * scale;
      var foliage = new THREE.Mesh(
        new THREE.IcosahedronGeometry(r, 1),
        makeMat(greens[i % greens.length], { r: 0.88 })
      );
      var a = (i / layers) * Math.PI * 2 + Math.random() * 0.5;
      var d = i * 0.06 * scale;
      foliage.position.set(Math.cos(a) * d, trunkH + r * 0.4 + i * r * 0.42, Math.sin(a) * d);
      foliage.castShadow = true;
      group.add(foliage);
    }
    group.position.set(x, 0, z);
    return group;
  }

  var treeData = [
    [-2.8, -1.8, 1], [-2.2, 2.2, 0.9], [2.5, -1.5, 0.95], [3, 1.8, 0.85],
    [-3.5, 0.5, 0.75], [3.8, -0.5, 0.7], [-1.5, -3, 0.65], [1.8, 2.8, 0.7],
    [0.2, -3.5, 0.6], [-3.2, -2.5, 0.55], [3.2, 2.5, 0.6], [0, 3.5, 0.55]
  ];
  for (var ti = 0; ti < treeData.length; ti++) {
    scene.add(makeTree(treeData[ti][0], treeData[ti][1], treeData[ti][2]));
  }

  // ==========================================================
  //                    石头
  // ==========================================================
  function makeRock(x, z, s) {
    s = s || 1;
    var geo = new THREE.IcosahedronGeometry(0.14, 0);
    var pos = geo.attributes.position;
    for (var i = 0; i < pos.count; i++) {
      pos.setX(i, pos.getX(i) * (0.7 + Math.random() * 0.6));
      pos.setY(i, pos.getY(i) * (0.5 + Math.random() * 0.4));
      pos.setZ(i, pos.getZ(i) * (0.7 + Math.random() * 0.6));
    }
    geo.computeVertexNormals();
    var rockCols = [0x556677, 0x667788, 0x4a5a6a, 0x788898, 0x5a6a7a];
    var rock = new THREE.Mesh(geo, makeMat(rockCols[Math.floor(Math.random() * rockCols.length)], { r: 0.94 }));
    rock.position.set(x, 0.07 * s, z);
    rock.scale.setScalar(s);
    rock.rotation.set(Math.random() * 0.3, Math.random() * Math.PI, Math.random() * 0.3);
    rock.castShadow = true;
    return rock;
  }

  var rockData = [
    [1.5, 0.8, 1.2], [-1.2, 1.2, 0.8], [2, -1, 1], [-1.8, -1.5, 0.7],
    [0.8, -2, 0.9], [-2.5, 0.2, 0.6], [2.8, 0.3, 0.8], [-0.5, 2.5, 0.5],
    [1, -2.5, 0.7], [-2.8, -0.8, 0.5], [0.3, 1.8, 0.4], [-1, -2.8, 0.6],
    [3, -1.2, 0.5], [-3, 1.8, 0.4]
  ];
  for (var ri = 0; ri < rockData.length; ri++) {
    scene.add(makeRock(rockData[ri][0], rockData[ri][1], rockData[ri][2]));
  }

  // 石堆
  function makePile(x, z) {
    var g = new THREE.Group();
    for (var i = 0; i < 4; i++) {
      g.add(makeRock(Math.random() * 0.3 - 0.15, Math.random() * 0.3 - 0.15, 0.3 + Math.random() * 0.5));
    }
    g.position.set(x, 0, z);
    return g;
  }
  scene.add(makePile(1.8, 1));
  scene.add(makePile(-1.5, -1));
  scene.add(makePile(2.5, -2));

  // ==========================================================
  //                    草丛 & 蘑菇
  // ==========================================================
  var grassMat1 = makeMat(0x3a6a3a, { r: 0.88 });
  var grassMat2 = makeMat(0x4a7a4a, { r: 0.88 });

  function makeGrass(x, z) {
    var g = new THREE.Group();
    var n = 3 + Math.floor(Math.random() * 4);
    for (var i = 0; i < n; i++) {
      var h = 0.12 + Math.random() * 0.22;
      var blade = new THREE.Mesh(
        new THREE.ConeGeometry(0.015, h, 4),
        i % 2 === 0 ? grassMat1 : grassMat2
      );
      blade.position.set(Math.random() * 0.12 - 0.06, h / 2, Math.random() * 0.12 - 0.06);
      blade.rotation.z = (Math.random() - 0.5) * 0.35;
      g.add(blade);
    }
    g.position.set(x, 0, z);
    return g;
  }

  for (var gi = 0; gi < 45; gi++) {
    var ga = Math.random() * Math.PI * 2;
    var gd = 1.2 + Math.random() * 5;
    scene.add(makeGrass(Math.cos(ga) * gd, Math.sin(ga) * gd));
  }

  // 小蘑菇
  function makeShroom(x, z, s) {
    s = s || 1;
    var g = new THREE.Group();
    var stem = new THREE.Mesh(
      new THREE.CylinderGeometry(0.02 * s, 0.025 * s, 0.1 * s, 6),
      makeMat(0xf0e8d0, { r: 0.8 })
    );
    stem.position.y = 0.05 * s;
    g.add(stem);
    var cap = new THREE.Mesh(
      new THREE.SphereGeometry(0.05 * s, 10, 10),
      makeMat(0xd04040, { r: 0.6 })
    );
    cap.position.y = 0.11 * s;
    cap.scale.set(1, 0.55, 1);
    g.add(cap);
    g.position.set(x, 0, z);
    return g;
  }
  scene.add(makeShroom(1.2, 1.5, 0.8));
  scene.add(makeShroom(-1.8, 0.6, 0.6));
  scene.add(makeShroom(0.5, -2.2, 0.7));
  scene.add(makeShroom(-2.2, -1.8, 0.5));

  // ==========================================================
  //                    萤火虫粒子
  // ==========================================================
  var ffCount = 140;
  var ffPositions = new Float32Array(ffCount * 3);
  var ffMeta = [];
  for (var fi = 0; fi < ffCount; fi++) {
    var fth = Math.random() * Math.PI * 2;
    var fr = 1.8 + Math.random() * 5;
    ffPositions[fi * 3]     = Math.cos(fth) * fr;
    ffPositions[fi * 3 + 1] = 0.3 + Math.random() * 3.5;
    ffPositions[fi * 3 + 2] = Math.sin(fth) * fr;
    ffMeta.push({ sp: 0.15 + Math.random() * 0.5, ph: Math.random() * Math.PI * 2, r: fr, th: fth });
  }
  var ffGeo = new THREE.BufferGeometry();
  ffGeo.setAttribute('position', new THREE.BufferAttribute(ffPositions, 3));
  var ffMat = new THREE.PointsMaterial({
    color: 0xffeebb, size: 0.07, transparent: true, opacity: 0.75,
    sizeAttenuation: true, blending: THREE.AdditiveBlending, depthWrite: false
  });
  scene.add(new THREE.Points(ffGeo, ffMat));

  // ==========================================================
  //                    动作系统
  // ==========================================================
  var POSES = {
    standing: { bY: 0.7, hX: 0, hZ: 0 },
    lying:    { bY: 0.3, hX: -0.45, hZ: 0.25 },
    laughing: { bY: 0.75, hX: 0.12, hZ: 0 }
  };
  var POSE_NAMES = { standing: '站立中', lying: '晒肚皮模式', laughing: '捧腹大笑' };
  var curPose = 'standing';
  var tgtB = 0.7, tgtHX = 0, tgtHZ = 0;
  var curB = 0.7, curHX = 0, curHZ = 0;

  function setPose(name) {
    curPose = name;
    tgtB  = POSES[name].bY;
    tgtHX = POSES[name].hX;
    tgtHZ = POSES[name].hZ;
    laughMesh.visible = (name === 'laughing');
    var tip = document.getElementById('pose-tip');
    tip.textContent = POSE_NAMES[name] + ' · 点击狮子切换';
    tip.classList.add('show');
    setTimeout(function() { tip.classList.remove('show'); }, 2500);
  }

  // ==========================================================
  //                    点击爆发粒子
  // ==========================================================
  var burstPoints = null;
  var burstLife = 0;

  function spawnBurst() {
    if (burstPoints) { scene.remove(burstPoints); burstPoints.geometry.dispose(); }
    var n = 220;
    var bPos = new Float32Array(n * 3);
    var bVel = [];
    for (var i = 0; i < n; i++) {
      bPos[i * 3]     = 0;
      bPos[i * 3 + 1] = curB + 1;
      bPos[i * 3 + 2] = 0.2;
      var th = Math.random() * Math.PI * 2;
      var ph = Math.random() * Math.PI;
      var sp = 1.5 + Math.random() * 3;
      bVel.push(Math.sin(ph) * Math.cos(th) * sp, Math.sin(ph) * Math.sin(th) * sp, Math.cos(ph) * sp);
    }
    var bGeo = new THREE.BufferGeometry();
    bGeo.setAttribute('position', new THREE.BufferAttribute(bPos, 3));
    burstPoints = new THREE.Points(bGeo, new THREE.PointsMaterial({
      color: 0xffd080, size: 0.09, transparent: true, opacity: 1,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
    }));
    burstPoints.userData.vel = bVel;
    scene.add(burstPoints);
    burstLife = 1;
  }

  // ==========================================================
  //                    交互（点击 vs 拖拽区分）
  // ==========================================================
  var raycaster = new THREE.Raycaster();
  var pointer = new THREE.Vector2();
  var poseOrder = ['standing', 'lying', 'laughing'];
  var poseIdx = 0;
  var downX = 0, downY = 0;

  renderer.domElement.addEventListener('pointerdown', function(e) {
    downX = e.clientX; downY = e.clientY;
  });
  renderer.domElement.addEventListener('pointerup', function(e) {
    var dx = e.clientX - downX, dy = e.clientY - downY;
    if (Math.sqrt(dx * dx + dy * dy) > 8) return; // 拖拽不触发
    pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    if (raycaster.intersectObjects(lion.children, true).length > 0) {
      poseIdx = (poseIdx + 1) % 3;
      setPose(poseOrder[poseIdx]);
      spawnBurst();
    }
  });

  // ==========================================================
  //                    动画循环
  // ==========================================================
  var clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    var dt = clock.getDelta();
    var t  = clock.getElapsedTime();
    var lerp = 3.5;

    // 姿态插值
    curB  += (tgtB  - curB)  * lerp * dt;
    curHX += (tgtHX - curHX) * lerp * dt;
    curHZ += (tgtHZ - curHZ) * lerp * dt;
    bodyGroup.position.y = curB;
    headGroup.rotation.x = curHX;
    headGroup.rotation.z = curHZ;

    // 呼吸
    bodyGroup.position.y += Math.sin(t * 1.2) * 0.025;
    headGroup.position.y  = 1.72 + Math.sin(t * 1.5) * 0.015;
    headGroup.rotation.y  = Math.sin(t * 0.3) * 0.04;

    // 大笑抖动
    if (curPose === 'laughing') {
      bodyGroup.position.y += Math.sin(t * 8) * 0.04;
      headGroup.rotation.x += Math.sin(t * 6) * 0.08;
      laughMesh.scale.y = 0.6 + Math.sin(t * 10) * 0.15;
    }

    // 尾巴摆动
    tailTip.position.x = 0.12 + Math.sin(t * 2.5) * 0.1;
    tailTip.position.y = 0.88 + Math.cos(t * 2.5) * 0.05;

    // 鬃毛
    var maneTarget = curPose === 'lying' ? 1.18 : curPose === 'laughing' ? 1.08 : 1.0;
    var maneCur = maneGroup.scale.x + (maneTarget - maneGroup.scale.x) * dt * 3;
    maneGroup.scale.set(maneCur, maneCur, maneCur);
    maneGroup.rotation.z = t * 0.08;

    if (curPose !== 'standing') {
      for (var mi = 0; mi < allManeParts.length; mi++) {
        var mp = allManeParts[mi];
        if (!mp.userData.cloned) {
          mp.material = mp.material.clone();
          mp.userData.cloned = true;
        }
        mp.material.emissive = new THREE.Color(0xffa040);
        mp.material.emissiveIntensity = 0.12 + Math.sin(t * 3 + mi * 0.15) * 0.08;
      }
    }

    // 萤火虫
    var fp = ffGeo.attributes.position.array;
    for (var fi = 0; fi < ffCount; fi++) {
      var d = ffMeta[fi];
      d.th += d.sp * dt * 0.3;
      fp[fi * 3]     = Math.cos(d.th) * d.r;
      fp[fi * 3 + 1] += Math.sin(t * d.sp + d.ph) * dt * 0.28;
      fp[fi * 3 + 2] = Math.sin(d.th) * d.r;
      if (fp[fi * 3 + 1] < 0.2) fp[fi * 3 + 1] = 0.2;
      if (fp[fi * 3 + 1] > 3.8) fp[fi * 3 + 1] = 3.8;
    }
    ffGeo.attributes.position.needsUpdate = true;
    ffMat.opacity = 0.45 + Math.sin(t * 1.5) * 0.28;

    // 爆发粒子
    if (burstPoints && burstLife > 0) {
      burstLife -= dt * 0.8;
      burstPoints.material.opacity = Math.max(0, burstLife);
      var bp = burstPoints.geometry.attributes.position.array;
      var bv = burstPoints.userData.vel;
      for (var bi = 0; bi < bp.length / 3; bi++) {
        bp[bi * 3]     += bv[bi * 3] * dt;
        bp[bi * 3 + 1] += bv[bi * 3 + 1] * dt;
        bp[bi * 3 + 2] += bv[bi * 3 + 2] * dt;
        bv[bi * 3 + 1] -= 2.5 * dt;
      }
      burstPoints.geometry.attributes.position.needsUpdate = true;
      if (burstLife <= 0) {
        scene.remove(burstPoints);
        burstPoints.geometry.dispose();
        burstPoints = null;
      }
    }

    controls.update();
    renderer.render(scene, camera);
  }

  // 窗口缩放
  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // 隐藏加载页 & 启动
  statusEl.textContent = '场景就绪！';
  setTimeout(function() {
    document.getElementById('loader').classList.add('hide');
    document.getElementById('ui').classList.add('show');
    setPose('standing');
  }, 800);

  animate();
}

// ========== 内联简易轨道控制器（当 CDN OrbitControls 加载失败时使用）==========
function createInlineControls(camera, domElement) {
  var target = new THREE.Vector3(0, 1.2, 0);
  var spherical = new THREE.Spherical();
  var sphericalDelta = new THREE.Spherical();
  var scale = 1;
  var dampingFactor = 0.08;
  var minDist = 3, maxDist = 14;
  var minPolar = 0.1, maxPolar = Math.PI * 0.55;
  var rotateStart = new THREE.Vector2();
  var isRotating = false;
  var offset = new THREE.Vector3();

  offset.copy(camera.position).sub(target);
  spherical.setFromVector3(offset);

  domElement.addEventListener('mousedown', function(e) {
    if (e.button === 0) { isRotating = true; rotateStart.set(e.clientX, e.clientY); }
  });
  domElement.addEventListener('mousemove', function(e) {
    if (!isRotating) return;
    var dx = e.clientX - rotateStart.x, dy = e.clientY - rotateStart.y;
    sphericalDelta.theta -= 2 * Math.PI * dx / domElement.clientWidth;
    sphericalDelta.phi   -= 2 * Math.PI * dy / domElement.clientHeight;
    rotateStart.set(e.clientX, e.clientY);
  });
  domElement.addEventListener('mouseup', function() { isRotating = false; });
  domElement.addEventListener('wheel', function(e) {
    e.preventDefault();
    if (e.deltaY < 0) scale /= 0.95;
    else scale *= 0.95;
  }, { passive: false });

  // 触摸
  var touchStart = new THREE.Vector2();
  var touchDist = 0;
  var touchState = -1;
  domElement.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      touchState = 0;
      touchStart.set(e.touches[0].pageX, e.touches[0].pageY);
    } else if (e.touches.length === 2) {
      touchState = 2;
      var dx = e.touches[0].pageX - e.touches[1].pageX;
      var dy = e.touches[0].pageY - e.touches[1].pageY;
      touchDist = Math.sqrt(dx * dx + dy * dy);
    }
  }, { passive: false });
  domElement.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (touchState === 0 && e.touches.length === 1) {
      var dx = e.touches[0].pageX - touchStart.x;
      var dy = e.touches[0].pageY - touchStart.y;
      sphericalDelta.theta -= 2 * Math.PI * dx / domElement.clientWidth;
      sphericalDelta.phi   -= 2 * Math.PI * dy / domElement.clientHeight;
      touchStart.set(e.touches[0].pageX, e.touches[0].pageY);
    } else if (touchState === 2 && e.touches.length === 2) {
      var dx2 = e.touches[0].pageX - e.touches[1].pageX;
      var dy2 = e.touches[0].pageY - e.touches[1].pageY;
      var d = Math.sqrt(dx2 * dx2 + dy2 * dy2);
      if (d > touchDist) scale /= 0.95; else scale *= 0.95;
      touchDist = d;
    }
  }, { passive: false });
  domElement.addEventListener('touchend', function() { touchState = -1; });
  domElement.addEventListener('contextmenu', function(e) { e.preventDefault(); });

  return {
    enableDamping: true,
    dampingFactor: 0.08,
    minDistance: minDist,
    maxDistance: maxDist,
    maxPolarAngle: maxPolar,
    target: target,
    update: function() {
      offset.copy(camera.position).sub(target);
      spherical.setFromVector3(offset);
      spherical.theta += sphericalDelta.theta;
      spherical.phi   += sphericalDelta.phi;
      spherical.phi = Math.max(minPolar, Math.min(maxPolar, spherical.phi));
      spherical.radius *= scale;
      spherical.radius = Math.max(minDist, Math.min(maxDist, spherical.radius));
      offset.setFromSpherical(spherical);
      camera.position.copy(target).add(offset);
      camera.lookAt(target);
      sphericalDelta.theta *= (1 - dampingFactor);
      sphericalDelta.phi   *= (1 - dampingFactor);
      scale = 1;
    }
  };
}
