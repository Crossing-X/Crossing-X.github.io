<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>狮小新 · 肚皮向阳</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0f1a;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#fff}
  #loader{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#1c2440 0%,#0b0f1a 70%);transition:opacity .8s ease}
  #loader.hide{opacity:0;pointer-events:none}
  .loader-lion{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#f7d48a 0%,#d4a24e 60%,#8b5e2a 100%);box-shadow:0 0 60px rgba(247,212,138,.4);animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1);box-shadow:0 0 60px rgba(247,212,138,.4)}50%{transform:scale(1.08);box-shadow:0 0 90px rgba(247,212,138,.6)}}
  .loader-text{margin-top:28px;font-size:18px;letter-spacing:6px;opacity:.85;animation:fadeText 2s ease-in-out infinite alternate}
  @keyframes fadeText{from{opacity:.5}to{opacity:1}}
  #canvas-wrap{position:fixed;inset:0;z-index:1}
  canvas{display:block;width:100%!important;height:100%!important}
  #ui{position:fixed;bottom:0;left:0;right:0;z-index:10;pointer-events:none;padding:0 24px 36px;text-align:center}
  #ui h1{font-size:clamp(28px,5vw,48px);font-weight:700;letter-spacing:4px;text-shadow:0 0 30px rgba(247,212,138,.5);margin-bottom:12px;opacity:0;transform:translateY(20px);transition:all 1s ease .3s}
  #ui p{font-size:clamp(13px,2vw,16px);line-height:1.9;max-width:680px;margin:0 auto;opacity:0;transform:translateY(16px);transition:all 1s ease .6s;color:rgba(255,255,255,.82);text-shadow:0 0 12px rgba(0,0,0,.6)}
  #ui.show h1,#ui.show p{opacity:1;transform:translateY(0)}
  #hint{position:fixed;top:24px;right:28px;z-index:10;font-size:12px;letter-spacing:2px;opacity:0;transition:opacity 1.2s ease 1s;color:rgba(255,255,255,.5)}
  #hint.show{opacity:1}
  @media(max-width:600px){#ui{padding:0 16px 24px}#hint{right:16px;top:16px}}
</style>
</head>
<body>

<div id="loader">
  <div class="loader-lion"></div>
  <div class="loader-text">狮子正在翻身找太阳…</div>
</div>

<div id="canvas-wrap"></div>

<div id="hint">拖着转转看 · 滚轮拉近 · 戳一戳狮子</div>

<div id="ui">
  <h1>今天也要把肚皮交给太阳</h1>
  <p>嗷呜放放了放了嘛，<br>
  小新国庆就天天在地上晒肚皮，<br>
  这假期过得比谁都标准嗷～<br>
  肚皮朝天 · 诸事不管</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- 基础场景 ---------- */
const wrap = document.getElementById('canvas-wrap');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b0f1a, 0.035);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 2.2, 6.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI / 2 + 0.15;
controls.target.set(0, 0.8, 0);
controls.update();

/* ---------- 灯光 ---------- */
const ambient = new THREE.AmbientLight(0x8090c0, 0.6);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfff0d0, 1.8);
sun.position.set(4, 8, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 20;
sun.shadow.camera.left = -6;
sun.shadow.camera.right = 6;
sun.shadow.camera.top = 6;
sun.shadow.camera.bottom = -6;
sun.shadow.bias = -0.002;
scene.add(sun);

const rim = new THREE.SpotLight(0xffd080, 2.5, 15, Math.PI / 5, 0.6, 1);
rim.position.set(-3, 4, -3);
rim.target.position.set(0, 1, 0);
scene.add(rim);
scene.add(rim.target);

const fill = new THREE.PointLight(0x6080ff, 0.6, 12);
fill.position.set(-3, 2, 4);
scene.add(fill);

/* ---------- 地面 ---------- */
const groundGeo = new THREE.CircleGeometry(12, 64);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x1a2238,
  roughness: 0.9,
  metalness: 0.05
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- 材质工厂 ---------- */
function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness: opts.roughness ?? 0.7,
    metalness: opts.metalness ?? 0.05,
    ...opts
  });
}

/* ---------- 程序化建模：Q版狮小新 ---------- */
const lionGroup = new THREE.Group();
scene.add(lionGroup);

// 身体
const bodyGeo = new THREE.CapsuleGeometry(0.52, 0.7, 16, 24);
const bodyMat = mat(0xf5f0e8, { roughness: 0.85 });
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.position.y = 0.85;
body.castShadow = true;
lionGroup.add(body);

// 头
const headGeo = new THREE.SphereGeometry(0.58, 32, 32);
const headMat = mat(0xfaf6ef, { roughness: 0.8 });
const head = new THREE.Mesh(headGeo, headMat);
head.position.set(0, 1.72, 0.15);
head.scale.set(1, 0.95, 0.95);
head.castShadow = true;
lionGroup.add(head);

// 鬃毛环（可展开）
const maneGroup = new THREE.Group();
maneGroup.position.copy(head.position);
lionGroup.add(maneGroup);

const maneCount = 28;
const maneBaseRadius = 0.62;
const maneExpandedRadius = 1.05;
const manePetals = [];
const maneGeo = new THREE.SphereGeometry(0.18, 12, 12);
for (let i = 0; i < maneCount; i++) {
  const angle = (i / maneCount) * Math.PI * 2;
  const layer = i % 3;
  const r = maneBaseRadius + layer * 0.06;
  const m = new THREE.Mesh(maneGeo, mat(0xd4a24e, { roughness: 0.75 }));
  m.position.set(Math.cos(angle) * r, Math.sin(angle) * r * 0.85, -0.08 - layer * 0.05);
  m.scale.setScalar(0.9 + Math.random() * 0.3);
  m.castShadow = true;
  maneGroup.add(m);
  manePetals.push({ mesh: m, baseAngle: angle, baseR: r, layer });
}

// 耳朵
const earGeo = new THREE.SphereGeometry(0.14, 16, 16);
const earMat = mat(0xe8c87a);
[-1, 1].forEach(side => {
  const ear = new THREE.Mesh(earGeo, earMat);
  ear.position.set(side * 0.42, 2.15, 0.05);
  ear.scale.set(1, 1.2, 0.6);
  ear.castShadow = true;
  lionGroup.add(ear);
});

// 眼睛
const eyeWhiteGeo = new THREE.SphereGeometry(0.1, 16, 16);
const eyeWhiteMat = mat(0xffffff, { roughness: 0.3 });
const pupilGeo = new THREE.SphereGeometry(0.055, 16, 16);
const pupilMat = mat(0x1a1a2e, { roughness: 0.2, metalness: 0.3 });
const highlightGeo = new THREE.SphereGeometry(0.022, 8, 8);
const highlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
[-1, 1].forEach(side => {
  const eyeW = new THREE.Mesh(eyeWhiteGeo, eyeWhiteMat);
  eyeW.position.set(side * 0.22, 1.78, 0.58);
  lionGroup.add(eyeW);
  const pupil = new THREE.Mesh(pupilGeo, pupilMat);
  pupil.position.set(side * 0.22, 1.78, 0.66);
  lionGroup.add(pupil);
  const hl = new THREE.Mesh(highlightGeo, highlightMat);
  hl.position.set(side * 0.2, 1.8, 0.69);
  lionGroup.add(hl);
});

// 鼻子
const noseGeo = new THREE.SphereGeometry(0.06, 12, 12);
const noseMat = mat(0xc48a6a, { roughness: 0.5 });
const nose = new THREE.Mesh(noseGeo, noseMat);
nose.position.set(0, 1.68, 0.68);
nose.scale.set(1.2, 0.8, 0.8);
lionGroup.add(nose);

// 嘴巴（微笑弧线）
const smileCurve = new THREE.QuadraticBezierCurve3(
  new THREE.Vector3(-0.1, 1.6, 0.66),
  new THREE.Vector3(0, 1.56, 0.68),
  new THREE.Vector3(0.1, 1.6, 0.66)
);
const smileGeo = new THREE.TubeGeometry(smileCurve, 16, 0.012, 8, false);
const smileMat = new THREE.MeshBasicMaterial({ color: 0x6b4a3a });
lionGroup.add(new THREE.Mesh(smileGeo, smileMat));

// 前爪
const pawGeo = new THREE.SphereGeometry(0.16, 16, 16);
const pawMat = mat(0xf5f0e8, { roughness: 0.85 });
[-1, 1].forEach(side => {
  const paw = new THREE.Mesh(pawGeo, pawMat);
  paw.position.set(side * 0.35, 0.16, 0.35);
  paw.scale.set(1, 0.7, 1.2);
  paw.castShadow = true;
  lionGroup.add(paw);
});

// 尾巴
const tailCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 0.6, -0.4),
  new THREE.Vector3(0, 0.5, -0.8),
  new THREE.Vector3(0.15, 0.7, -1.1),
  new THREE.Vector3(0.1, 0.9, -1.25)
]);
const tailGeo = new THREE.TubeGeometry(tailCurve, 20, 0.06, 8, false);
const tail = new THREE.Mesh(tailGeo, mat(0xe8dcc8));
tail.castShadow = true;
lionGroup.add(tail);

const tailTipGeo = new THREE.SphereGeometry(0.1, 12, 12);
const tailTip = new THREE.Mesh(tailTipGeo, mat(0xd4a24e));
tailTip.position.set(0.1, 0.9, -1.25);
lionGroup.add(tailTip);

/* ---------- 矮树（比狮子矮） ---------- */
function createTree(x, z, scale = 1) {
  const g = new THREE.Group();
  // 树干
  const trunkH = 0.35 * scale;
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.04 * scale, 0.06 * scale, trunkH, 8),
    mat(0x6b4a3a, { roughness: 0.9 })
  );
  trunk.position.y = trunkH / 2;
  trunk.castShadow = true;
  g.add(trunk);
  // 树冠（多层球）
  const crownColors = [0x3a6b4a, 0x4a7b5a, 0x2d5a3d];
  const layers = 2 + Math.floor(Math.random() * 2);
  for (let i = 0; i < layers; i++) {
    const r = (0.22 - i * 0.04) * scale;
    const crown = new THREE.Mesh(
      new THREE.IcosahedronGeometry(r, 1),
      mat(crownColors[i % crownColors.length], { roughness: 0.85 })
    );
    crown.position.y = trunkH + r * 0.6 + i * r * 0.5;
    crown.castShadow = true;
    g.add(crown);
  }
  g.position.set(x, 0, z);
  return g;
}

const treePositions = [
  [-2.2, -1.5, 0.9], [-1.8, 1.8, 0.75], [2.0, -1.2, 0.85],
  [2.5, 1.5, 0.7], [-3.0, 0.3, 0.65], [3.2, -0.3, 0.6],
  [-1.2, -2.5, 0.55], [1.5, 2.3, 0.6], [0, -2.8, 0.5],
  [-2.8, -2.2, 0.5], [2.8, 2.0, 0.55]
];
treePositions.forEach(([x, z, s]) => scene.add(createTree(x, z, s)));

/* ---------- 萤火虫粒子 ---------- */
const fireflyCount = 120;
const ffGeo = new THREE.BufferGeometry();
const ffPos = new Float32Array(fireflyCount * 3);
const ffData = [];
for (let i = 0; i < fireflyCount; i++) {
  const theta = Math.random() * Math.PI * 2;
  const r = 1.5 + Math.random() * 4;
  ffPos[i * 3] = Math.cos(theta) * r;
  ffPos[i * 3 + 1] = 0.3 + Math.random() * 3;
  ffPos[i * 3 + 2] = Math.sin(theta) * r;
  ffData.push({ speed: 0.2 + Math.random() * 0.5, phase: Math.random() * Math.PI * 2, radius: r, theta });
}
ffGeo.setAttribute('position', new THREE.BufferAttribute(ffPos, 3));
const ffMat = new THREE.PointsMaterial({
  color: 0xffeebb,
  size: 0.06,
  transparent: true,
  opacity: 0.8,
  sizeAttenuation: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const fireflies = new THREE.Points(ffGeo, ffMat);
scene.add(fireflies);

/* ---------- 点击爆发粒子 ---------- */
let burstParticles = null;
let burstLife = 0;
function createBurst() {
  if (burstParticles) { scene.remove(burstParticles); burstParticles.geometry.dispose(); }
  const count = 200;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const vel = [];
  for (let i = 0; i < count; i++) {
    pos[i * 3] = 0; pos[i * 3 + 1] = 1.7; pos[i * 3 + 2] = 0.2;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI;
    const sp = 1.5 + Math.random() * 2.5;
    vel.push(Math.sin(phi) * Math.cos(theta) * sp, Math.sin(phi) * Math.sin(theta) * sp, Math.cos(phi) * sp);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({
    color: 0xffd080, size: 0.08, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
  });
  burstParticles = new THREE.Points(geo, m);
  burstParticles.userData.vel = vel;
  scene.add(burstParticles);
  burstLife = 1.0;
}

/* ---------- 交互状态 ---------- */
let maneExpanded = false;
let maneT = 0;
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

renderer.domElement.addEventListener('pointerdown', e => {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(lionGroup.children, true);
  if (hits.length > 0) {
    maneExpanded = !maneExpanded;
    createBurst();
  }
});

/* ---------- 动画循环 ---------- */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();

  // 呼吸浮动
  lionGroup.position.y = Math.sin(t * 1.2) * 0.03;
  lionGroup.rotation.y = Math.sin(t * 0.3) * 0.05;

  // 尾巴摆动
  tailTip.position.x = 0.1 + Math.sin(t * 2.5) * 0.08;
  tailTip.position.y = 0.9 + Math.cos(t * 2.5) * 0.04;

  // 鬃毛展开/收回
  const targetT = maneExpanded ? 1 : 0;
  maneT += (targetT - maneT) * dt * 3;
  manePetals.forEach(p => {
    const r = p.baseR + (maneExpandedRadius - maneBaseRadius) * maneT * (1 + p.layer * 0.15);
    p.mesh.position.x = Math.cos(p.baseAngle + t * 0.2) * r;
    p.mesh.position.y = Math.sin(p.baseAngle + t * 0.2) * r * 0.85;
    const glow = maneExpanded ? 1 + Math.sin(t * 4 + p.baseAngle) * 0.15 : 1;
    p.mesh.scale.setScalar((0.9 + Math.random() * 0.1) * glow * (1 + maneT * 0.3));
  });

  // 鬃毛发光
  if (maneExpanded) {
    maneGroup.children.forEach(c => {
      if (c.material && !c.material._origEmissive) {
        c.material = c.material.clone();
        c.material._origEmissive = true;
        c.material.emissive = new THREE.Color(0xffa040);
        c.material.emissiveIntensity = 0.3 + Math.sin(t * 3) * 0.15;
      }
    });
  }

  // 萤火虫
  const ffPositions = fireflies.geometry.attributes.position.array;
  for (let i = 0; i < fireflyCount; i++) {
    const d = ffData[i];
    d.theta += d.speed * dt * 0.3;
    ffPositions[i * 3] = Math.cos(d.theta) * d.radius;
    ffPositions[i * 3 + 1] += Math.sin(t * d.speed + d.phase) * dt * 0.3;
    ffPositions[i * 3 + 2] = Math.sin(d.theta) * d.radius;
    if (ffPositions[i * 3 + 1] < 0.2) ffPositions[i * 3 + 1] = 0.2;
    if (ffPositions[i * 3 + 1] > 3.5) ffPositions[i * 3 + 1] = 3.5;
  }
  fireflies.geometry.attributes.position.needsUpdate = true;
  ffMat.opacity = 0.5 + Math.sin(t * 1.5) * 0.3;

  // 爆发粒子
  if (burstParticles && burstLife > 0) {
    burstLife -= dt * 0.8;
    burstParticles.material.opacity = Math.max(0, burstLife);
    const bp = burstParticles.geometry.attributes.position.array;
    const v = burstParticles.userData.vel;
    for (let i = 0; i < bp.length / 3; i++) {
      bp[i * 3] += v[i * 3] * dt;
      bp[i * 3 + 1] += v[i * 3 + 1] * dt;
      bp[i * 3 + 2] += v[i * 3 + 2] * dt;
      v[i * 3 + 1] -= 2.0 * dt; // gravity
    }
    burstParticles.geometry.attributes.position.needsUpdate = true;
    if (burstLife <= 0) {
      scene.remove(burstParticles);
      burstParticles.geometry.dispose();
      burstParticles = null;
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

/* ---------- 启动 ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// 模拟加载完成
setTimeout(() => {
  document.getElementById('loader').classList.add('hide');
  document.getElementById('ui').classList.add('show');
  document.getElementById('hint').classList.add('show');
}, 1800);

animate();
</script>
</body>
</html>
