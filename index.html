<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>狮小新 · 肚皮向阳</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#060a14;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#fff}
canvas{display:block}
#loader{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#14182e 0%,#060a14 72%);transition:opacity 1s ease}
#loader.hide{opacity:0;pointer-events:none}
.lchar{font-size:80px;color:#d4a24e;text-shadow:0 0 50px rgba(212,162,78,.5);animation:lp 2s ease-in-out infinite}
@keyframes lp{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.08);opacity:1}}
#lstatus{margin-top:18px;font-size:13px;letter-spacing:3px;color:rgba(255,255,255,.35)}

/* 顶部按钮栏 */
#bar{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:10px}
.pbtn{
  font-family:inherit;font-size:13px;letter-spacing:2px;
  padding:8px 20px;border-radius:24px;border:1px solid rgba(212,162,78,.3);
  background:rgba(212,162,78,.08);color:rgba(255,255,255,.7);
  cursor:pointer;transition:all .3s ease;user-select:none;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.pbtn:hover{background:rgba(212,162,78,.18);color:#fff;border-color:rgba(212,162,78,.5)}
.pbtn.active{background:rgba(212,162,78,.25);color:#ffd080;border-color:rgba(212,162,78,.6);box-shadow:0 0 16px rgba(212,162,78,.15)}

/* 底部文案 */
#ui{position:fixed;bottom:0;left:0;right:0;z-index:10;pointer-events:none;padding:0 24px 44px;text-align:center}
#ui h1{font-size:clamp(26px,4.5vw,44px);font-weight:700;letter-spacing:6px;text-shadow:0 0 30px rgba(212,162,78,.35);margin-bottom:12px;opacity:0;transform:translateY(20px);transition:all 1.2s cubic-bezier(.23,1,.32,1) .3s}
#ui .sub{font-size:clamp(12px,1.8vw,15px);letter-spacing:3px;opacity:0;transform:translateY(14px);transition:all 1.2s cubic-bezier(.23,1,.32,1) .6s;color:rgba(255,255,255,.5);margin-bottom:8px;line-height:1.8}
#ui .tag{font-size:clamp(13px,1.8vw,15px);letter-spacing:5px;opacity:0;transform:translateY(14px);transition:all 1.2s cubic-bezier(.23,1,.32,1) .9s;color:rgba(255,255,255,.3)}
#ui.show h1,#ui.show .sub,#ui.show .tag{opacity:1;transform:translateY(0)}

@media(max-width:600px){
  #bar{top:12px;gap:6px}
  .pbtn{font-size:11px;padding:6px 14px;letter-spacing:1px}
  #ui{padding:0 14px 28px}
}
</style>
</head>
<body>

<div id="loader">
  <div class="lchar">狮</div>
  <div id="lstatus">正在加载 3D 引擎…</div>
</div>

<!-- 顶部动作切换按钮 -->
<div id="bar">
  <button class="pbtn active" data-pose="standing">站立</button>
  <button class="pbtn" data-pose="lying">晒肚皮</button>
  <button class="pbtn" data-pose="laughing">捧腹大笑</button>
</div>

<div id="ui">
  <h1>肚皮交给太阳</h1>
  <p class="sub">嗷呜放放了放了嘛，<br>小新国庆就天天在地上晒肚皮，<br>这假期过得比谁都标准嗷～</p>
  <p class="tag">肚皮朝天 · 诸事不管</p>
</div>

<!-- CDN 竞速加载 three.js r128 UMD -->
<script>
(function(){
  var srcs=[
    {n:'npmmirror',t:'https://registry.npmmirror.com/three/0.128.0/files/build/three.min.js',c:'https://registry.npmmirror.com/three/0.128.0/files/examples/js/controls/OrbitControls.js'},
    {n:'unpkg',t:'https://unpkg.com/three@0.128.0/build/three.min.js',c:'https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js'},
    {n:'jsdelivr',t:'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',c:'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js'},
    {n:'bootcdn',t:'https://cdn.bootcdn.net/ajax/libs/three.js/r128/three.min.js'}
  ];
  var st=document.getElementById('lstatus'),i=0;
  function ld(url,ms){
    return new Promise(function(ok){
      var s=document.createElement('script'),done=false;
      var tm=setTimeout(function(){if(!done){done=true;s.onload=s.onerror=null;ok(false)}},ms);
      s.onload=function(){if(!done){done=true;clearTimeout(tm);ok(true)}};
      s.onerror=function(){if(!done){done=true;clearTimeout(tm);ok(false)}};
      s.src=url;document.head.appendChild(s);
    });
  }
  function nxt(){
    if(i>=srcs.length){st.textContent='加载失败，请刷新重试';return}
    var s=srcs[i];
    st.textContent='加载引擎 ('+(i+1)+'/'+srcs.length+')…';
    ld(s.t,8000).then(function(ok){
      if(ok&&typeof THREE!=='undefined'){
        if(s.c){ld(s.c,5000).then(function(){run()})}
        else{run()}
      }else{i++;nxt()}
    });
  }
  function run(){st.textContent='搭建场景中…';setTimeout(initScene,100)}
  nxt();
})();
</script>

<script>
/* ============================================================
   内联简易 OrbitControls（CDN 版加载失败时兜底）
   ============================================================ */
function InlineOrbitControls(cam,el){
  var self=this;
  self.target=new THREE.Vector3(0,1.2,0);
  self.enableDamping=true;self.dampingFactor=0.08;
  self.minDistance=3;self.maxDistance=14;
  self.maxPolarAngle=Math.PI*0.52;
  self.minPolarAngle=Math.PI*0.08;
  var sph=new THREE.Spherical(),dSph=new THREE.Spherical(),sc=1;
  var off=new THREE.Vector3();
  off.copy(cam.position).sub(self.target);sph.setFromVector3(off);
  var rs=new THREE.Vector2(),rot=false;
  el.addEventListener('mousedown',function(e){if(e.button===0){rot=true;rs.set(e.clientX,e.clientY)}});
  el.addEventListener('mousemove',function(e){if(!rot)return;var dx=e.clientX-rs.x,dy=e.clientY-rs.y;dSph.theta-=2*Math.PI*dx/el.clientWidth;dSph.phi-=2*Math.PI*dy/el.clientHeight;rs.set(e.clientX,e.clientY)});
  el.addEventListener('mouseup',function(){rot=false});
  el.addEventListener('wheel',function(e){e.preventDefault();sc*=e.deltaY<0?0.95:1.05},{passive:false});
  var ts=new THREE.Vector2(),td=0,tst=-1;
  el.addEventListener('touchstart',function(e){if(e.touches.length===1){tst=0;ts.set(e.touches[0].pageX,e.touches[0].pageY)}else if(e.touches.length===2){tst=2;var dx=e.touches[0].pageX-e.touches[1].pageX,dy=e.touches[0].pageY-e.touches[1].pageY;td=Math.sqrt(dx*dx+dy*dy)}},{passive:false});
  el.addEventListener('touchmove',function(e){e.preventDefault();if(tst===0&&e.touches.length===1){var dx=e.touches[0].pageX-ts.x,dy=e.touches[0].pageY-ts.y;dSph.theta-=2*Math.PI*dx/el.clientWidth;dSph.phi-=2*Math.PI*dy/el.clientHeight;ts.set(e.touches[0].pageX,e.touches[0].pageY)}else if(tst===2&&e.touches.length===2){var dx2=e.touches[0].pageX-e.touches[1].pageX,dy2=e.touches[0].pageY-e.touches[1].pageY;var d=Math.sqrt(dx2*dx2+dy2*dy2);sc*=d>td?0.97:1.03;td=d}},{passive:false});
  el.addEventListener('touchend',function(){tst=-1});
  el.addEventListener('contextmenu',function(e){e.preventDefault()});
  self.update=function(){
    off.copy(cam.position).sub(self.target);sph.setFromVector3(off);
    sph.theta+=dSph.theta;sph.phi+=dSph.phi;
    sph.phi=Math.max(self.minPolarAngle,Math.min(self.maxPolarAngle,sph.phi));
    sph.radius*=sc;sph.radius=Math.max(self.minDistance,Math.min(self.maxDistance,sph.radius));
    off.setFromSpherical(sph);cam.position.copy(self.target).add(off);cam.lookAt(self.target);
    var d=self.enableDamping?(1-self.dampingFactor):0;
    dSph.theta*=d;dSph.phi*=d;sc=1;
  };
}

/* ============================================================
   场景主逻辑
   ============================================================ */
function initScene(){
  var st=document.getElementById('lstatus');
  var W=window.innerWidth,H=window.innerHeight;

  /* --- 渲染器 --- */
  var R=new THREE.WebGLRenderer({antialias:true});
  R.setPixelRatio(Math.min(devicePixelRatio,2));
  R.setSize(W,H);
  R.shadowMap.enabled=true;
  R.shadowMap.type=THREE.PCFSoftShadowMap;
  R.toneMapping=THREE.ACESFilmicToneMapping;
  R.toneMappingExposure=1.1;
  R.outputEncoding=THREE.sRGBEncoding;
  document.body.appendChild(R.domElement);

  /* --- 场景 & 相机 --- */
  var scene=new THREE.Scene();
  scene.background=new THREE.Color(0x060a14);
  scene.fog=new THREE.FogExp2(0x060a14,0.018);

  var cam=new THREE.PerspectiveCamera(38,W/H,0.1,120);
  cam.position.set(0,3.2,8.5);

  /* --- 控制器 --- */
  var ctrl;
  if(typeof THREE.OrbitControls!=='undefined'){
    ctrl=new THREE.OrbitControls(cam,R.domElement);
  }else{
    ctrl=new InlineOrbitControls(cam,R.domElement);
  }
  ctrl.enableDamping=true;ctrl.dampingFactor=0.07;
  ctrl.minDistance=3;ctrl.maxDistance=14;
  ctrl.maxPolarAngle=Math.PI*0.52;
  ctrl.target.set(0,1.1,0);ctrl.update();

  /* ============================================================
     灯光
     ============================================================ */
  scene.add(new THREE.AmbientLight(0x8090c0,0.45));
  scene.add(new THREE.HemisphereLight(0x87ceeb,0x2a1a0a,0.35));

  var sun=new THREE.DirectionalLight(0xfff0d0,2.2);
  sun.position.set(6,12,8);sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.near=0.5;sun.shadow.camera.far=30;
  sun.shadow.camera.left=-10;sun.shadow.camera.right=10;
  sun.shadow.camera.top=10;sun.shadow.camera.bottom=-10;
  sun.shadow.bias=-0.0008;
  scene.add(sun);

  var rim=new THREE.SpotLight(0xffd080,2.5,22,Math.PI/5,0.5,1);
  rim.position.set(-5,6,-5);
  var rimTgt=new THREE.Object3D();rimTgt.position.set(0,1.2,0);scene.add(rimTgt);
  rim.target=rimTgt;scene.add(rim);

  scene.add(Object.assign(new THREE.PointLight(0x5070ff,0.4,16),{position:new THREE.Vector3(-5,2.5,6)}));
  scene.add(Object.assign(new THREE.PointLight(0xffa040,0.35,12),{position:new THREE.Vector3(0,0.5,3)}));

  /* ============================================================
     地面：有厚度的土层 + 草地层
     ============================================================ */
  var GROUND_Y=0; // 地面基准高度

  // 土层（圆柱体，有厚度）
  var soilGeo=new THREE.CylinderGeometry(16,16.5,0.6,64,1);
  var soilMat=new THREE.MeshStandardMaterial({color:0x5a3a1e,roughness:0.95,metalness:0.02});
  var soil=new THREE.Mesh(soilGeo,soilMat);
  soil.position.y=GROUND_Y-0.3;soil.receiveShadow=true;
  scene.add(soil);

  // 土层截面（侧面可见的土色）
  var soilRimGeo=new THREE.TorusGeometry(16.25,0.3,8,64);
  var soilRimMat=new THREE.MeshStandardMaterial({color:0x4a2a12,roughness:0.95});
  var soilRim=new THREE.Mesh(soilRimGeo,soilRimMat);
  soilRim.rotation.x=Math.PI/2;soilRim.position.y=GROUND_Y-0.3;
  scene.add(soilRim);

  // 草地表面
  var grassTopGeo=new THREE.CircleGeometry(16,64);
  var grassTopMat=new THREE.MeshStandardMaterial({color:0x2a5a28,roughness:0.92,metalness:0.02});
  var grassTop=new THREE.Mesh(grassTopGeo,grassTopMat);
  grassTop.rotation.x=-Math.PI/2;grassTop.position.y=GROUND_Y+0.01;
  grassTop.receiveShadow=true;scene.add(grassTop);

  // 草地边缘过渡（略深）
  var grassEdgeGeo=new THREE.RingGeometry(14,16,64);
  var grassEdgeMat=new THREE.MeshStandardMaterial({color:0x1e4a1e,roughness:0.95});
  var grassEdge=new THREE.Mesh(grassEdgeGeo,grassEdgeMat);
  grassEdge.rotation.x=-Math.PI/2;grassEdge.position.y=GROUND_Y+0.015;
  scene.add(grassEdge);

  // 脚下暖光圈
  var glowGeo=new THREE.CircleGeometry(2.8,32);
  var glowMat=new THREE.MeshBasicMaterial({color:0xd4a24e,transparent:true,opacity:0.06,blending:THREE.AdditiveBlending,depthWrite:false});
  var glow=new THREE.Mesh(glowGeo,glowMat);
  glow.rotation.x=-Math.PI/2;glow.position.y=GROUND_Y+0.02;scene.add(glow);

  /* ============================================================
     材质工具
     ============================================================ */
  function M(c,opts){
    opts=opts||{};
    var p={color:c,roughness:opts.r!==undefined?opts.r:0.7,metalness:opts.m!==undefined?opts.m:0.05};
    if(opts.transparent){p.transparent=true;p.opacity=opts.opacity!==undefined?opts.opacity:1}
    if(opts.flat)p.flatShading=true;
    if(opts.side!==undefined)p.side=opts.side;
    if(opts.emissive)p.emissive=new THREE.Color(opts.emissive);
    if(opts.emissiveIntensity!==undefined)p.emissiveIntensity=opts.emissiveIntensity;
    return new THREE.MeshStandardMaterial(p);
  }

  /* ============================================================
     狮小新模型 —— 严格按图片 1:1 建模

     图片分析：
     · 头身比约 1:1.1，Q版大头圆身
     · 鬃毛：金黄色蓬松放射环，约 3-4 层包裹头部后方和两侧，
       鬃毛球体大小从内到外递减，外层颜色略深
     · 脸部/身体：纯白/奶白色，圆润饱满
     · 耳朵：金色外缘 + 粉色内耳，半圆形，竖立微外翻
     · 眼睛：大而圆，深色瞳孔，白色高光在右上
     · 鼻子：粉色倒三角/心形，小巧
     · 嘴巴：微笑弧线，嘴角上扬
     · 腮红：两颊粉色圆形腮红，半透明
     · 前爪：金色，圆润，朝前放置
     · 后腿/脚：金色，粗壮，向后弯曲
     · 尾巴：白色根部渐变为金色蓬松尾尖，向上微卷
     · 整体站姿：四脚着地，挺胸抬头，骄傲可爱
     ============================================================ */

  var lion=new THREE.Group();
  scene.add(lion);
  var bodyG=new THREE.Group();
  lion.add(bodyG);

  /* --- 身体（白色蓬松椭球）--- */
  var torso=new THREE.Mesh(new THREE.SphereGeometry(0.65,48,48),M(0xfaf6ee,{r:0.88}));
  torso.position.y=0.72;torso.scale.set(1.05,0.9,0.88);torso.castShadow=true;
  bodyG.add(torso);

  // 胸口过渡（略凸）
  var chest=new THREE.Mesh(new THREE.SphereGeometry(0.48,32,32),M(0xfcf8f0,{r:0.9}));
  chest.position.set(0,0.8,0.22);chest.scale.set(0.9,0.85,0.6);
  bodyG.add(chest);

  // 肚皮（最白最亮）
  var bellyMesh=new THREE.Mesh(new THREE.SphereGeometry(0.44,32,32),M(0xffffff,{r:0.92}));
  bellyMesh.position.set(0,0.6,0.3);bellyMesh.scale.set(0.85,0.82,0.55);
  bodyG.add(bellyMesh);

  // 背部弧度
  var back=new THREE.Mesh(new THREE.SphereGeometry(0.52,32,32),M(0xf5f0e5,{r:0.88}));
  back.position.set(0,0.78,-0.15);back.scale.set(0.95,0.82,0.75);
  bodyG.add(back);

  /* --- 头部 --- */
  var headG=new THREE.Group();
  headG.position.set(0,1.72,0.15);
  bodyG.add(headG);

  var headMesh=new THREE.Mesh(new THREE.SphereGeometry(0.56,48,48),M(0xfcf8f0,{r:0.82}));
  headMesh.scale.set(1,0.94,0.92);headMesh.castShadow=true;headG.add(headMesh);

  // 脸颊（微微鼓起）
  var cheekL=new THREE.Mesh(new THREE.SphereGeometry(0.22,24,24),M(0xfef9f2,{r:0.85}));
  cheekL.position.set(-0.28,-0.08,0.35);cheekL.scale.set(1,0.9,0.7);headG.add(cheekL);
  var cheekR=cheekL.clone();cheekR.position.x=0.28;headG.add(cheekR);

  /* --- 鬃毛：5 层蓬松金环，严格还原图片放射状排列 --- */
  var maneG=new THREE.Group();
  maneG.position.set(0,0.02,-0.05);
  headG.add(maneG);

  var maneConfigs=[
    // [数量, 球体半径, 环半径, Y缩放, Z偏移, 颜色]
    {n:10,r:0.20,R:0.48,sY:0.85,dZ:0.02,col:0xecc868},   // 最内层·最大球
    {n:14,r:0.17,R:0.60,sY:0.82,dZ:-0.02,col:0xe4c060},
    {n:18,r:0.15,R:0.72,sY:0.78,dZ:-0.06,col:0xdab858},
    {n:20,r:0.13,R:0.82,sY:0.75,dZ:-0.10,col:0xd0a848},
    {n:16,r:0.11,R:0.90,sY:0.72,dZ:-0.14,col:0xc49838}    // 最外层·最小球·最深色
  ];
  var allMane=[];

  for(var li=0;li<maneConfigs.length;li++){
    var cfg=maneConfigs[li];
    var mGeo=new THREE.SphereGeometry(cfg.r,12,12);
    for(var mi=0;mi<cfg.n;mi++){
      var angle=(mi/cfg.n)*Math.PI*2+(li%2)*(Math.PI/cfg.n*0.5);
      var piece=new THREE.Mesh(mGeo,M(cfg.col,{r:0.72}));
      var rx=Math.cos(angle)*cfg.R;
      var ry=Math.sin(angle)*cfg.R*cfg.sY;
      piece.position.set(rx,ry,cfg.dZ+(Math.random()-0.5)*0.04);
      var sc=0.85+Math.random()*0.3;
      piece.scale.set(sc,sc*0.92,sc*0.85);
      piece.castShadow=true;
      maneG.add(piece);
      allMane.push(piece);
    }
  }

  // 鬃毛顶部额外蓬松（图片中头顶鬃毛特别高）
  var topManeGeo=new THREE.SphereGeometry(0.18,10,10);
  for(var ti=0;ti<6;ti++){
    var tm=new THREE.Mesh(topManeGeo,M(0xecc868,{r:0.72}));
    var ta=(ti/6)*Math.PI*0.8+Math.PI*0.1;
    tm.position.set(Math.cos(ta)*0.35,0.55+Math.random()*0.08,Math.sin(ta)*0.15-0.08);
    tm.scale.setScalar(0.8+Math.random()*0.3);
    tm.castShadow=true;maneG.add(tm);allMane.push(tm);
  }

  /* --- 耳朵：金色外 + 粉色内，半圆竖立 --- */
  var earOuterGeo=new THREE.SphereGeometry(0.14,16,16);
  var earInnerGeo=new THREE.SphereGeometry(0.085,14,14);

  for(var es=-1;es<=1;es+=2){
    var earO=new THREE.Mesh(earOuterGeo,M(0xd4a24e,{r:0.78}));
    earO.position.set(es*0.44,0.42,0.0);
    earO.scale.set(0.85,1.3,0.5);earO.rotation.z=es*0.15;
    earO.castShadow=true;headG.add(earO);

    var earI=new THREE.Mesh(earInnerGeo,M(0xf0a0a8,{r:0.55}));
    earI.position.set(es*0.44,0.42,0.055);
    earI.scale.set(0.7,1.1,0.45);earI.rotation.z=es*0.15;
    headG.add(earI);
  }

  /* --- 眼睛：大圆眼 + 白高光 --- */
  for(var eyeS=-1;eyeS<=1;eyeS+=2){
    // 眼眶（白色）
    var ew=new THREE.Mesh(new THREE.SphereGeometry(0.105,20,20),M(0xffffff,{r:0.2}));
    ew.position.set(eyeS*0.22,0.08,0.48);
    ew.scale.set(1,1.05,0.7);headG.add(ew);

    // 瞳孔（深蓝黑）
    var ep=new THREE.Mesh(new THREE.SphereGeometry(0.068,18,18),M(0x141428,{r:0.12,m:0.4}));
    ep.position.set(eyeS*0.22,0.08,0.54);
    ep.scale.set(1,1.05,0.65);headG.add(ep);

    // 主高光（右上白点）
    var eh1=new THREE.Mesh(new THREE.SphereGeometry(0.024,10,10),new THREE.MeshBasicMaterial({color:0xffffff}));
    eh1.position.set(eyeS*0.19,0.12,0.58);headG.add(eh1);

    // 次高光（左下小点）
    var eh2=new THREE.Mesh(new THREE.SphereGeometry(0.012,8,8),new THREE.MeshBasicMaterial({color:0xffffff}));
    eh2.position.set(eyeS*0.25,0.04,0.57);headG.add(eh2);
  }

  /* --- 鼻子：粉色倒三角 --- */
  var noseMesh=new THREE.Mesh(new THREE.SphereGeometry(0.048,14,14),M(0xd8909a,{r:0.4}));
  noseMesh.position.set(0,-0.06,0.54);

  /* ============================================================
     环境：精细树木（与狮子等高 ≈ 3 单位，带细致树叶）
     ============================================================ */
  function makeTree(x,z,sc){
    sc=sc||1;
    var g=new THREE.Group();
    var tH=1.8*sc;

    // 树干（渐变粗细）
    var trunkGeo=new THREE.CylinderGeometry(0.04*sc,0.1*sc,tH,10);
    var trunkMat=M(0x5a3a22,{r:0.92});
    var trunk=new THREE.Mesh(trunkGeo,trunkMat);
    trunk.position.y=tH/2;trunk.castShadow=true;g.add(trunk);

    // 树枝（2-3 根细枝从主干伸出）
    var branchCount=2+Math.floor(Math.random()*2);
    for(var bi=0;bi<branchCount;bi++){
      var bAngle=Math.random()*Math.PI*2;
      var bLen=(0.3+Math.random()*0.3)*sc;
      var bY=tH*0.4+Math.random()*tH*0.35;
      var branch=new THREE.Mesh(
        new THREE.CylinderGeometry(0.012*sc,0.025*sc,bLen,6),
        M(0x4a3020,{r:0.92})
      );
      branch.position.set(Math.cos(bAngle)*bLen*0.4,bY,Math.sin(bAngle)*bLen*0.4);
      branch.rotation.z=Math.cos(bAngle)*0.6;
      branch.rotation.x=Math.sin(bAngle)*0.3;
      branch.castShadow=true;g.add(branch);
    }

    // 树冠：多层不同绿色的 IcosahedronGeometry + 细节叶片
    var greens=[0x1e5a28,0x2a6a38,0x3a7a48,0x2e6030,0x4a8a58,0x1a4a20,0x357040];
    var crownLayers=5+Math.floor(Math.random()*3);
    for(var ci=0;ci<crownLayers;ci++){
      var cr=(0.38-ci*0.035)*sc;
      if(cr<0.08)continue;
      var cAngle=(ci/crownLayers)*Math.PI*2+Math.random()*0.8;
      var cDist=ci*0.05*sc;
      var cY=tH+cr*0.3+ci*cr*0.38;
      var crown=new THREE.Mesh(
        new THREE.IcosahedronGeometry(cr,1),
        M(greens[ci%greens.length],{r:0.85})
      );
      crown.position.set(Math.cos(cAngle)*cDist,cY,Math.sin(cAngle)*cDist);
      crown.rotation.set(Math.random(),Math.random(),Math.random());
      crown.castShadow=true;g.add(crown);
    }

    // 叶片细节：在树冠表面随机分布小叶片（扁锥体）
    var leafGeo=new THREE.ConeGeometry(0.025*sc,0.08*sc,4);
    var leafMats=[M(0x2a7a3a,{r:0.8}),M(0x3a8a4a,{r:0.8}),M(0x1e6a2e,{r:0.8})];
    var leafCount=20+Math.floor(Math.random()*15);
    for(var lfi=0;lfi<leafCount;lfi++){
      var la=Math.random()*Math.PI*2;
      var lr=(0.2+Math.random()*0.25)*sc;
      var ly=tH+0.3*sc+Math.random()*crownLayers*0.15*sc;
      var leaf=new THREE.Mesh(leafGeo,leafMats[lfi%leafMats.length]);
      leaf.position.set(Math.cos(la)*lr,ly,Math.sin(la)*lr);
      leaf.rotation.set((Math.random()-0.5)*1.2,Math.random()*Math.PI,(Math.random()-0.5)*0.8);
      g.add(leaf);
    }

    g.position.set(x,GROUND_Y,z);
    return g;
  }

  function makeRock(x,z,s){

    geo.computeVertexNormals();
    var rCols=[0x556677,0x667788,0x4a5a6a,0x788898,0x5a6a7a,0x4a5a68];
    var rock=new THREE.Mesh(geo,M(rCols[Math.floor(Math.random()*rCols.length)],{r:0.94}));
    rock.position.set(x,GROUND_Y+0.06*s,z);

    rock.rotation.set(Math.random()*0.4,Math.random()*Math.PI,Math.random()*0.4);

  /* ============================================================
     萤火虫
     ============================================================ */
  var ffN=160,ffPos=new Float32Array(ffN*3),ffMeta=[];
  for(var ffi=0;ffi<ffN;ffi++){
    var fth=Math.random()*Math.PI*2,fr=2+Math.random()*6;
    ffPos[ffi*3]=Math.cos(fth)*fr;

  }
  var ffGeo=new THREE.BufferGeometry();
  ffGeo.setAttribute('position',new THREE.BufferAttribute(ffPos,3));

  /* ============================================================
     动作系统 + 按钮
     ============================================================ */
  var POSES={
    standing:{bY:0.02,hX:0,hZ:0,hY:0},
    lying:{bY:-0.12,hX:-0.55,hZ:0.3,hY:0.4},
    laughing:{bY:0.04,hX:0.1,hZ:0,hY:0}
  };
  var curPose='standing';
  var tgtB=0.02,tgtHX=0,tgtHZ=0,tgtHY=0;
  var curB=0.02,curHX=0,curHZ=0,curHY=0;

  function setPose(name){
    curPose=name;
    var p=POSES[name];
    tgtB=p.bY;tgtHX=p.hX;tgtHZ=p.hZ;tgtHY=p.hY;
    laughOuter.visible=(name==='laughing');
    laughInner.visible=(name==='laughing');
    smileMesh.visible=(name!=='laughing');

    // 更新按钮高亮
    var btns=document.querySelectorAll('.pbtn');
    for(var bi=0;bi<btns.length;bi++){
      if(btns[bi].getAttribute('data-pose')===name){
        btns[bi].classList.add('active');
      }else{
        btns[bi].classList.remove('active');
      }
    }

    // 粒子爆发
    spawnBurst();
  }

  // 按钮事件
  var btns=document.querySelectorAll('.pbtn');
  for(var bi=0;bi<btns.length;bi++){

  /* ============================================================
     点击爆发粒子
     ============================================================ */
  var burstPts=null,burstLife=0;

  function spawnBurst(){
    if(burstPts){scene.remove(burstPts);burstPts.geometry.dispose()}
    var n=250,bPos=new Float32Array(n*3),bVel=[];
    for(var i=0;i<n;i++){
      bPos[i*3]=0;bPos[i*3+1]=curB+1.8;bPos[i*3+2]=0.2;
      var th=Math.random()*Math.PI*2,ph=Math.random()*Math.PI,sp=1.8+Math.random()*3.5;
      bVel.push(Math.sin(ph)*Math.cos(th)*sp,Math.sin(ph)*Math.sin(th)*sp+1.5,Math.cos(ph)*sp);
    }
    var bGeo=new THREE.BufferGeometry();
    bGeo.setAttribute('position',new THREE.BufferAttribute(bPos,3));
    burstPts=new THREE.Points(bGeo,new THREE.PointsMaterial({
      color:0xffd080,size:0.1,transparent:true,opacity:1,
      blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true
    }));
    burstPts.userData.vel=bVel;scene.add(burstPts);burstLife=1;
  }

  /* ============================================================
     动画循环
     ============================================================ */
  var clock=new THREE.Clock();

  function animate(){
    requestAnimationFrame(animate);
    var dt=Math.min(clock.getDelta(),0.05);
    var t=clock.getElapsedTime();
    var sp=3.5;

    // 姿态插值
    curB+=(tgtB-curB)*sp*dt;
    curHX+=(tgtHX-curHX)*sp*dt;
    curHZ+=(tgtHZ-curHZ)*sp*dt;
    curHY+=(tgtHY-curHY)*sp*dt;

    bodyG.position.y=curB;
    headG.rotation.x=curHX;
    headG.rotation.z=curHZ;
    bodyG.rotation.y=curHY;

    // 呼吸
    var breathe=Math.sin(t*1.2)*0.02;
    bodyG.position.y+=breathe;
    headG.position.y=1.72+Math.sin(t*1.5)*0.012;

    // 站立时轻微摇头
    if(curPose==='standing'){
      headG.rotation.y=Math.sin(t*0.4)*0.06;
    }

    // 大笑抖动
    if(curPose==='laughing'){
      bodyG.position.y+=Math.sin(t*9)*0.035;
      headG.rotation.x+=Math.sin(t*7)*0.1;
      laughOuter.scale.y=0.65+Math.sin(t*11)*0.15;
      laughInner.scale.y=0.4+Math.sin(t*11)*0.12;
    }

    // 晒肚皮时身体微晃
    if(curPose==='lying'){
      bodyG.rotation.z=Math.sin(t*0.8)*0.03;
    }

    // 尾巴摆动
    tailTipG.position.x=0.1+Math.sin(t*2.8)*0.12;
    tailTipG.position.y=0.82+Math.cos(t*2.8)*0.06;
    tailTipG.rotation.z=Math.sin(t*2)*0.15;

    // 鬃毛呼吸感
    var maneTgt=curPose==='lying'?1.15:curPose==='laughing'?1.1:1.0;
    var maneNow=maneG.scale.x+(maneTgt-maneG.scale.x)*dt*2.5;
    maneG.scale.set(maneNow,maneNow,maneNow);
    maneG.rotation.z=Math.sin(t*0.6)*0.03;

    // 鬃毛自发光（非站立时）
    if(curPose!=='standing'){
      for(var mi=0;mi<allMane.length;mi++){
        var mp=allMane[mi];
        if(!mp.userData._cm){mp.material=mp.material.clone();mp.userData._cm=true}
        mp.material.emissive=new THREE.Color(0xffa040);
        mp.material.emissiveIntensity=0.08+Math.sin(t*2.5+mi*0.12)*0.06;
      }
    }

    // 萤火虫
    var fp=ffGeo.attributes.position.array;
    for(var fi=0;fi<ffN;fi++){
      var d=ffMeta[fi];
      d.th+=d.sp*dt*0.3;
      fp[fi*3]=Math.cos(d.th)*d.r;
      fp[fi*3+1]+=Math.sin(t*d.sp+d.ph)*dt*0.25;
      fp[fi*3+2]=Math.sin(d.th)*d.r;
      if(fp[fi*3+1]<0.3)fp[fi*3+1]=0.3;
      if(fp[fi*3+1]>4.5)fp[fi*3+1]=4.5;
    }
    ffGeo.attributes.position.needsUpdate=true;
    ffMat.opacity=0.4+Math.sin(t*1.2)*0.3;

    // 爆发粒子
    if(burstPts&&burstLife>0){
      burstLife-=dt*0.7;
      burstPts.material.opacity=Math.max(0,burstLife);
      var bp=burstPts.geometry.attributes.position.array;
      var bv=burstPts.userData.vel;
      for(var bi=0;bi<bp.length/3;bi++){
        bp[bi*3]+=bv[bi*3]*dt;
        bp[bi*3+1]+=bv[bi*3+1]*dt;
        bp[bi*3+2]+=bv[bi*3+2]*dt;
        bv[bi*3+1]-=3*dt;
      }
      burstPts.geometry.attributes.position.needsUpdate=true;
      if(burstLife<=0){scene.remove(burstPts);burstPts.geometry.dispose();burstPts=null}
    }

    ctrl.update();
    R.render(scene,cam);
  }

  // 窗口缩放
  window.addEventListener('resize',function(){
    cam.aspect=window.innerWidth/window.innerHeight;
    cam.updateProjectionMatrix();
    R.setSize(window.innerWidth,window.innerHeight);
  });

  // 启动
  st.textContent='场景就绪！';
  setTimeout(function(){
    document.getElementById('loader').classList.add('hide');
    document.getElementById('ui').classList.add('show');
  },600);

  animate();
}
</script>
</body>
</html>
